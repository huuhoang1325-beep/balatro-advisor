<title>Balatro Advisor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Bố cục: bảng hẹp nổi cạnh game. Trên = trạng thái blind (2 dòng), giữa = hành động + gợi ý, dưới = 4 tab. */
:root {
  --felt: #0e2420;      /* nền */
  --panel: #163a33;     /* khối nổi */
  --panel-2: #1f4a41;   /* nút, ô nhập */
  --line: #2f5f54;
  --ink: #f1f5f2;
  --muted: #a9c2b9;
  --chips: #3d8fe6;     /* chip (xanh dương như game) */
  --mult: #ef5056;      /* mult (đỏ như game) */
  --gold: #f0bd45;      /* tiền */
  --go: #4fd096;        /* nên làm */
  --paper: #f5f2ea;
  --paper-ink: #1b1b1d;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
  --num: ui-monospace, "SF Mono", "Roboto Mono", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--felt); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.4; }
* { box-sizing: border-box; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

.app { height: 100%; display: flex; flex-direction: column; max-width: 600px; margin: 0 auto; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; padding-block: 12px 20px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px; }
.scroll > * { flex-shrink: 0; }

/* Trạng thái */
.status { background: var(--panel); border-bottom: 1px solid var(--line); padding-block: 8px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); display: grid; gap: 8px; }
.row1 { display: flex; align-items: center; gap: 10px; }
.blindbtn { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-weight: 600; white-space: nowrap; }
.prog { flex: 1; min-width: 0; display: grid; gap: 3px; }
.prog .bar { height: 6px; background: var(--felt); border-radius: 3px; overflow: hidden; }
.prog .bar i { display: block; height: 100%; width: 0; background: var(--go); }
.prog .nums { font-family: var(--num); font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prog .need { color: var(--mult); }
.row2 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.ctr { display: flex; align-items: center; justify-content: space-between; background: var(--felt); border-radius: 8px; padding: 2px; }
.ctr span { font-size: 13px; color: var(--muted); padding-left: 6px; }
.ctr b { font-family: var(--num); font-size: 17px; min-width: 2.2ch; text-align: center; }
.ctr.h b { color: var(--chips); } .ctr.d b { color: var(--mult); } .ctr.m b { color: var(--gold); }
.ctr button { width: 30px; height: 30px; border: 0; border-radius: 6px; background: var(--panel-2); font-size: 18px; line-height: 1; }

/* Nút */
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.actions.one { grid-template-columns: 1fr; }
.btn { min-height: 46px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); font-weight: 600; font-size: 16px; }
.btn.small { min-height: 38px; font-size: 14px; padding: 0 10px; }
.btn.primary { background: var(--gold); border-color: var(--gold); color: #2a1f05; }
.btn.go { background: var(--go); border-color: var(--go); color: #05281a; }
.btn.danger { background: transparent; border-color: var(--mult); color: #ff9da1; }
.btn.ghost { background: transparent; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > .grow { flex: 1; }

/* Thẻ kết quả */
.result { background: var(--panel); border: 2px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 8px; }
.result.play { border-color: var(--go); } .result.discard { border-color: var(--mult); } .result.info { border-color: var(--gold); }
.verdict { font-size: 22px; font-weight: 800; letter-spacing: .01em; }
.result.play .verdict { color: var(--go); } .result.discard .verdict { color: var(--mult); } .result.info .verdict { color: var(--gold); }
.cards-inline { display: flex; flex-wrap: wrap; gap: 6px; }
.chipcard { background: var(--paper); color: var(--paper-ink); border-radius: 6px; padding: 2px 8px; font-weight: 700; font-family: var(--num); }
.chipcard.red { color: #c8242d; }
.score { font-family: var(--num); font-variant-numeric: tabular-nums; font-size: 15px; }
.score .c { background: var(--chips); color: #fff; padding: 1px 6px; border-radius: 4px; }
.score .m { background: var(--mult); color: #fff; padding: 1px 6px; border-radius: 4px; }
.why { color: var(--muted); margin: 0; font-size: 15px; }
.alts { display: grid; gap: 4px; font-size: 14px; color: var(--muted); }
.alts div { display: flex; justify-content: space-between; gap: 8px; border-top: 1px solid var(--line); padding-top: 4px; }

/* Danh sách hành động shop */
.plan { display: grid; gap: 6px; }
.step { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; background: var(--felt); border-radius: 10px; padding: 8px 10px; }
.step .tag { font-size: 12px; font-weight: 800; padding: 3px 7px; border-radius: 6px; letter-spacing: .03em; }
.step.buy .tag { background: var(--go); color: #05281a; }
.step.skip { opacity: .7; } .step.skip .tag { background: var(--line); color: var(--muted); }
.step.pick .tag { background: var(--gold); color: #2a1f05; }
.step b { display: block; }
.step small { color: var(--muted); font-size: 13px; display: block; }
.price { font-family: var(--num); color: var(--gold); font-weight: 700; }

/* Tay bài */
.sec { display: flex; align-items: baseline; gap: 8px; }
.sec h2 { font-size: 16px; font-weight: 700; margin: 0; }
.sec small { color: var(--muted); margin-left: auto; font-size: 13px; }
.hand { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 5px; padding-top: 8px; }
.hand .empty { grid-column: 1 / -1; }
.card { width: 100%; aspect-ratio: 5 / 7; border-radius: 6px; background: var(--paper); color: var(--paper-ink); border: 2px solid transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; font-weight: 800; font-size: 17px; line-height: 1.05; padding: 0; transition: transform .15s; }
.card .s { font-size: 18px; }
.card.red { color: #c8242d; }
.card.sel { border-color: var(--gold); transform: translateY(-4px); }
.card.play { box-shadow: 0 0 0 3px var(--go); transform: translateY(-8px); }
.card.disc { box-shadow: 0 0 0 3px var(--mult); opacity: .75; }
.card .tg { position: absolute; bottom: 2px; left: 1px; right: 1px; font-size: 8px; font-weight: 700; text-transform: uppercase; background: #00000014; border-radius: 2px; }
.card .seal { position: absolute; top: 3px; right: 3px; width: 8px; height: 8px; border-radius: 50%; }
.card.ed-foil { background: linear-gradient(135deg, #e4ecf6, #c9d8ea); } .card.ed-holo { background: linear-gradient(135deg, #fbe1e6, #e7f4ff); } .card.ed-poly { background: linear-gradient(135deg, #ffe5c2, #e2ffd9, #e3dcff); }
.empty { color: var(--muted); border: 1px dashed var(--line); border-radius: 10px; padding: 14px; text-align: center; width: 100%; font-size: 15px; }

/* Bàn phím */
details.pad { background: var(--panel); border-radius: 12px; padding: 10px; }
details.pad summary { font-weight: 600; cursor: pointer; }
.padin { display: grid; gap: 6px; margin-top: 10px; }
.ranks { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.suits { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.k { min-height: 42px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); font-weight: 700; font-size: 17px; }
.k.on { background: var(--gold); color: #2a1f05; border-color: var(--gold); }
.k.suit-H, .k.suit-D { color: #ff8a8f; }
.k.wide { font-size: 13px; font-weight: 600; }
.mods { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
label.f { display: grid; gap: 3px; font-size: 13px; color: var(--muted); }
.sel { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; min-height: 40px; width: 100%; }

/* Joker / mục */
.list { display: grid; gap: 6px; }
.item { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.item .nm { min-width: 0; }
.item .nm b { display: block; font-weight: 700; }
.item .nm small { color: var(--muted); font-size: 13px; }
.item .ctl { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.item input { width: 64px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px; min-height: 36px; }
.ib { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); }
.kind { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.search { width: 100%; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 46px; }
.results { display: grid; gap: 2px; max-height: 280px; overflow-y: auto; }
.results button { text-align: left; background: transparent; border: 0; border-bottom: 1px solid var(--line); padding: 9px 4px; }
.results button small { color: var(--muted); display: block; font-size: 13px; }
.note { color: var(--muted); font-size: 13px; margin: 0; }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--felt); border-radius: 10px; padding: 3px; }
.seg button { border: 0; background: transparent; border-radius: 8px; min-height: 36px; font-weight: 600; color: var(--muted); }
.seg button.on { background: var(--panel-2); color: var(--ink); }

/* Cài đặt */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.levels { display: grid; gap: 4px; }
.levels div { display: grid; grid-template-columns: 1fr auto auto auto; gap: 6px; align-items: center; font-size: 15px; }
.levels b { font-family: var(--num); min-width: 3ch; text-align: center; }
.deckgrid { display: grid; grid-template-columns: repeat(13, 1fr); gap: 2px; }
.deckgrid button { aspect-ratio: 3/4; max-width: 100%; border-radius: 3px; border: 0; background: var(--paper); color: var(--paper-ink); font-weight: 700; font-size: 10px; padding: 0; }
.deckgrid button.red { color: #c8242d; }
.deckgrid button.gone { opacity: .18; }
.deckgrid button.inhand { outline: 2px solid var(--gold); }

/* Tab */
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--panel); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabs button { background: transparent; border: 0; min-height: 50px; color: var(--muted); font-weight: 600; font-size: 15px; border-top: 3px solid transparent; }
.tabs button.on { color: var(--ink); border-top-color: var(--gold); }

/* Màn ngang của điện thoại: bảng thấp (~390px) → gộp trạng thái 1 dòng, thu nhỏ khung */
@media (max-height: 520px) {
  body { font-size: 15px; }
  .status { padding-block: 6px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .row1 { flex: 1 1 100%; }
  .row2 { flex: 1 1 100%; gap: 4px; }
  .ctr b { font-size: 15px; } .ctr span { font-size: 12px; padding-left: 4px; }
  .ctr button { width: 26px; height: 26px; font-size: 16px; }
  .blindbtn { padding: 4px 8px; font-size: 14px; }
  .scroll { padding-block: 8px 12px; gap: 10px; }
  .btn { min-height: 42px; font-size: 15px; }
  .verdict { font-size: 19px; }
  .tabs button { min-height: 40px; font-size: 14px; }
  .result { padding: 10px; gap: 6px; }
}

/* Bảng trượt */
.sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 88%; overflow-y: auto; background: var(--panel); border-top: 2px solid var(--gold); padding: 14px max(14px, env(safe-area-inset-left, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-right, 0px)); display: grid; gap: 10px; z-index: 20; max-width: 600px; margin: 0 auto; box-shadow: 0 -8px 24px #0008; }
.sheet img { height: 110px; image-rendering: pixelated; border-radius: 8px; background: #000; justify-self: start; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(66px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--felt); padding: 10px 16px; border-radius: 10px; font-weight: 600; z-index: 30; max-width: 90%; text-align: center; }
</style>

<div class="app">
  <header class="status">
    <div class="row1">
      <button class="blindbtn" id="blindBtn" aria-label="Sửa ante và blind">Ante 1 · Small</button>
      <div class="prog"><div class="bar"><i id="barFill"></i></div><div class="nums"><span id="scoreNow">0</span> / <span id="targetNum">300</span> · thiếu <span class="need" id="needNum">300</span></div></div>
    </div>
    <div class="row2">
      <div class="ctr h"><span>Đánh</span><button data-ctr="hands" data-d="-1" aria-label="Giảm lượt đánh">−</button><b id="handsN">4</b><button data-ctr="hands" data-d="1" aria-label="Tăng lượt đánh">+</button></div>
      <div class="ctr d"><span>Bỏ</span><button data-ctr="discards" data-d="-1" aria-label="Giảm lượt bỏ">−</button><b id="discardsN">3</b><button data-ctr="discards" data-d="1" aria-label="Tăng lượt bỏ">+</button></div>
      <div class="ctr m"><span>$</span><button data-ctr="money" data-d="-1" aria-label="Giảm tiền">−</button><b id="moneyN">4</b><button data-ctr="money" data-d="1" aria-label="Tăng tiền">+</button></div>
    </div>
  </header>
  <main class="scroll" id="view"></main>
  <nav class="tabs" id="tabs">
    <button data-tab="round" class="on">Vòng</button>
    <button data-tab="shop">Shop</button>
    <button data-tab="jokers">Joker</button>
    <button data-tab="setup">Cài đặt</button>
  </nav>
</div>
<div id="sheetHost"></div>
<div class="toast" id="toast" hidden></div>

<script>
window.BalatroEngine = (function(){
// Balatro Advisor — bộ não: nhận diện tay, tính điểm, chọn nước, xếp joker, chấm shop.
// Bám theo trình tự evaluate_play của Balatro 1.0.1. Giá trị ngẫu nhiên dùng kỳ vọng.

const SUITS = ['S', 'H', 'C', 'D'];
const SUIT_SYM = { S: '♠', H: '♥', C: '♣', D: '♦' };
const RANKS = [14, 13, 12, 11, 10, 9, 8, 7, 6, 5, 4, 3, 2];
const RANK_LABEL = { 14: 'A', 13: 'K', 12: 'Q', 11: 'J', 10: '10', 9: '9', 8: '8', 7: '7', 6: '6', 5: '5', 4: '4', 3: '3', 2: '2' };

const HAND_TYPES = [
  // tên, chip gốc, mult gốc, +chip/level, +mult/level, tên hành tinh
  ['Flush Five', 160, 16, 50, 3, 'Eris'],
  ['Flush House', 140, 14, 40, 4, 'Ceres'],
  ['Five of a Kind', 120, 12, 35, 3, 'Planet X'],
  ['Straight Flush', 100, 8, 40, 4, 'Neptune'],
  ['Four of a Kind', 60, 7, 30, 3, 'Mars'],
  ['Full House', 40, 4, 25, 2, 'Earth'],
  ['Flush', 35, 4, 15, 2, 'Jupiter'],
  ['Straight', 30, 4, 30, 3, 'Saturn'],
  ['Three of a Kind', 30, 3, 20, 2, 'Venus'],
  ['Two Pair', 20, 2, 20, 1, 'Uranus'],
  ['Pair', 10, 2, 15, 1, 'Mercury'],
  ['High Card', 5, 1, 10, 1, 'Pluto'],
];
const HAND_INFO = Object.fromEntries(HAND_TYPES.map(([n, c, m, dc, dm, p]) => [n, { chips: c, mult: m, dc, dm, planet: p }]));

// Điểm gốc mỗi ante (Small Blind). Big ×1,5, Boss ×2.
const ANTE_BASE = {
  white: [100, 300, 800, 2000, 5000, 11000, 20000, 35000, 50000],
  green: [100, 300, 900, 2600, 5500, 10000, 20000, 36000, 60000],
  purple: [100, 300, 1000, 3200, 9000, 25000, 60000, 110000, 200000],
};
const STAKES = ['White', 'Red', 'Green', 'Black', 'Blue', 'Purple', 'Orange', 'Gold'];
function blindTarget(stakeIdx, ante, blind /*0 small,1 big,2 boss*/, bossMult = 2) {
  const table = stakeIdx >= 5 ? ANTE_BASE.purple : stakeIdx >= 2 ? ANTE_BASE.green : ANTE_BASE.white;
  let base;
  if (ante <= 8) base = table[Math.max(0, ante)];
  else {
    // Endless: công thức của game (get_blind_amount)
    const a = table[8], b = 1.6, c = ante - 8, d = 1 + 0.2 * c;
    base = Math.floor(a * Math.pow(b + Math.pow(0.75 * c, d), c));
    const k = Math.pow(10, Math.floor(Math.log10(base)) - 1);
    base = Math.floor(base / k) * k;
  }
  const mult = blind === 0 ? 1 : blind === 1 ? 1.5 : bossMult;
  return Math.floor(base * mult);
}

// ---------- Lá bài ----------
let _uid = 1;
function makeCard(rank, suit, opts = {}) {
  return { id: opts.id || `c${_uid++}`, rank, suit, enh: opts.enh || null, ed: opts.ed || null, seal: opts.seal || null, bonusChips: opts.bonusChips || 0, debuffed: !!opts.debuffed };
}
function standardDeck() {
  const d = [];
  for (const s of SUITS) for (const r of RANKS) d.push(makeCard(r, s, { id: `${RANK_LABEL[r]}${s}` }));
  return d;
}
// 15 deck khởi đầu: chỉ số ảnh hưởng tới gợi ý + thành phần bộ bài.
// hands/discards/hand/slots/money là mức thay đổi so với gốc (4 đánh, 3 bỏ, 8 lá, 5 ô joker, $4).
const DECKS = [
  { id: 'red', name: 'Red Deck', vi: '+1 lượt bỏ', discards: 1 },
  { id: 'blue', name: 'Blue Deck', vi: '+1 lượt đánh', hands: 1 },
  { id: 'yellow', name: 'Yellow Deck', vi: '+$10 khởi đầu', money: 10 },
  { id: 'green', name: 'Green Deck', vi: 'Tiền theo lượt thừa, không có lãi', noInterest: true },
  { id: 'black', name: 'Black Deck', vi: '+1 ô joker, −1 lượt đánh', slots: 1, hands: -1 },
  { id: 'magic', name: 'Magic Deck', vi: 'Crystal Ball + 2 The Fool' },
  { id: 'nebula', name: 'Nebula Deck', vi: 'Telescope, −1 ô tiêu hao' },
  { id: 'ghost', name: 'Ghost Deck', vi: 'Spectral trong shop, có Hex' },
  { id: 'abandoned', name: 'Abandoned Deck', vi: 'Không có lá mặt (40 lá)', comp: 'noFace' },
  { id: 'checkered', name: 'Checkered Deck', vi: '26 ♠ + 26 ♥', comp: 'checkered' },
  { id: 'zodiac', name: 'Zodiac Deck', vi: 'Tarot/Planet Merchant, Overstock' },
  { id: 'painted', name: 'Painted Deck', vi: '+2 lá trên tay, −1 ô joker', hand: 2, slots: -1 },
  { id: 'anaglyph', name: 'Anaglyph Deck', vi: 'Double Tag sau mỗi Boss' },
  { id: 'plasma', name: 'Plasma Deck', vi: 'Cân bằng Chip và Mult, blind ×2', plasma: true },
  { id: 'erratic', name: 'Erratic Deck', vi: 'Số và chất ngẫu nhiên — sửa bộ bài bằng tay', comp: 'erratic' },
];
const DECK_BY_ID = Object.fromEntries(DECKS.map((d) => [d.id, d]));
function deckCards(deckId) {
  const d = DECK_BY_ID[deckId] || DECKS[0];
  if (d.comp === 'noFace') return standardDeck().filter((c) => c.rank < 11 || c.rank === 14);
  if (d.comp === 'checkered') {
    const out = [];
    for (const s of ['S', 'H']) for (const r of RANKS) for (const k of ['', 'b']) out.push(makeCard(r, s, { id: `${RANK_LABEL[r]}${s}${k}` }));
    return out;
  }
  return standardDeck();
}

const cardLabel =(c) => (c.enh === 'stone' ? 'Stone' : `${RANK_LABEL[c.rank]}${SUIT_SYM[c.suit]}`);
const isFace = (c, F) => c.enh !== 'stone' && (F.pareidolia || c.rank === 11 || c.rank === 12 || c.rank === 13);
const chipValue = (r) => (r === 14 ? 11 : r >= 10 ? 10 : r);

// ---------- Joker ----------
// kind: flat | suit | hand | xhand | perCard | held | retrig | rule | value | econ | copy
// value: true nếu joker có giá trị tích lũy người chơi nhập (vd Ride the Bus +12).
const JOKERS = [
  // +Mult / +Chip phẳng
  { id: 'joker', name: 'Joker', vi: '+4 Mult', r: 1 },
  { id: 'greedy', name: 'Greedy Joker', vi: '+3 Mult mỗi lá ♦ được tính', r: 1 },
  { id: 'lusty', name: 'Lusty Joker', vi: '+3 Mult mỗi lá ♥ được tính', r: 1 },
  { id: 'wrathful', name: 'Wrathful Joker', vi: '+3 Mult mỗi lá ♠ được tính', r: 1 },
  { id: 'gluttonous', name: 'Gluttonous Joker', vi: '+3 Mult mỗi lá ♣ được tính', r: 1 },

const JOKER_BY_ID = Object.fromEntries(JOKERS.map((j) => [j.id, j]));
const RETRIG = new Set(['hack', 'sock_and_buskin', 'hanging_chad', 'dusk', 'seltzer', 'mime']);
const RULES = ['four_fingers', 'shortcut', 'smeared', 'pareidolia', 'splash'];

// Joker hiệu lực sau khi Blueprint/Brainstorm sao chép.
function resolveJokers(jokers) {
  const out = [];
  const target = (i, seen) => {
    const j = jokers[i];
    if (!j || j.disabled) return null;
    if (j.id !== 'blueprint' && j.id !== 'brainstorm') return j;
    if (seen.has(i)) return null;
    seen.add(i);
    return j.id === 'blueprint' ? target(i + 1, seen) : target(0, seen);
  };
  jokers.forEach((j, i) => {
    if (j.disabled) { out.push({ src: j, eff: null }); return; }
    let eff = j;
    if (j.id === 'blueprint' || j.id === 'brainstorm') {
      const t = target(i, new Set());
      eff = t && !RULES.includes(t.id) ? t : null; // bản sao không chép luật
    }
    out.push({ src: j, eff });
  });
  return out;
}
function ruleFlags(jokers) {
  const F = {};
  for (const j of jokers) if (!j.disabled && RULES.includes(j.id)) F[j.id] = true;

}

// ---------- Nhận diện tay ----------
function effSuits(c, F) {
  if (c.enh === 'stone') return [];
  if (c.enh === 'wild') return SUITS;
  if (F.smeared) return c.suit === 'H' || c.suit === 'D' ? ['H', 'D'] : ['S', 'C'];
  return [c.suit];
}
function findFlush(cards, F) {
  const need = F.four_fingers ? 4 : 5;
  if (cards.length < need) return null;
  for (const s of SUITS) {
    const m = cards.filter((c) => effSuits(c, F).includes(s));
    if (m.length >= need) return m;
  }
  return null;
}
function findStraight(cards, F) {
  const need = F.four_fingers ? 4 : 5;
  const real = cards.filter((c) => c.enh !== 'stone');
  if (real.length < need) return null;
  const present = new Set();
  for (const c of real) { present.add(c.rank); if (c.rank === 14) present.add(1); }
  // tìm chuỗi dài nhất (cho phép cách 1 bậc với Shortcut)
  let best = null;
  for (let start = 1; start <= 14; start++) {
    if (!present.has(start)) continue;
    const seq = [start];
    let cur = start;
    while (true) {
      if (present.has(cur + 1)) cur = cur + 1;
      else if (F.shortcut && present.has(cur + 2)) cur = cur + 2;
      else break;
      seq.push(cur);
    }
    if (seq.length >= need && (!best || seq.length > best.length)) best = seq;
  }
  if (!best) return null;
  const ranks = new Set(best.map((r) => (r === 1 ? 14 : r)));
  return real.filter((c) => ranks.has(c.rank));
}
function detectHand(cards, F = {}) {
  const real = cards.filter((c) => c.enh !== 'stone');
  const groups = {};
  for (const c of real) (groups[c.rank] ||= []).push(c);
  const gs = Object.values(groups).sort((a, b) => b.length - a.length || b[0].rank - a[0].rank);
  const flush = findFlush(cards, F);
  const straight = findStraight(cards, F);
  const n0 = gs[0]?.length || 0, n1 = gs[1]?.length || 0;
  const contains = {
    pair: n0 >= 2, three: n0 >= 3, four: n0 >= 4, twoPair: n0 >= 2 && n1 >= 2 || n0 >= 4,
    straight: !!straight, flush: !!flush,
  };
  let type, scoring;
  if (n0 >= 5 && flush) { type = 'Flush Five'; scoring = gs[0]; }
  else if (n0 >= 3 && n1 >= 2 && flush) { type = 'Flush House'; scoring = [...gs[0], ...gs[1]]; }
  else if (n0 >= 5) { type = 'Five of a Kind'; scoring = gs[0]; }
  else if (straight && flush) { type = 'Straight Flush'; scoring = [...new Set([...straight, ...flush])]; }
  else if (n0 >= 4) { type = 'Four of a Kind'; scoring = gs[0]; }
  else if (n0 >= 3 && n1 >= 2) { type = 'Full House'; scoring = [...gs[0], ...gs[1]]; }
  else if (flush) { type = 'Flush'; scoring = flush; }
  else if (straight) { type = 'Straight'; scoring = straight; }
  else if (n0 >= 3) { type = 'Three of a Kind'; scoring = gs[0]; }
  else if (n0 >= 2 && n1 >= 2) { type = 'Two Pair'; scoring = [...gs[0], ...gs[1]]; }
  else if (n0 >= 2) { type = 'Pair'; scoring = gs[0]; }
  else {
    type = 'High Card';
    scoring = real.length ? [real.reduce((a, b) => (b.rank > a.rank ? b : a))] : [];
  }
  if (contains.four) contains.three = true;
  const set = new Set(scoring);
  for (const c of cards) if (c.enh === 'stone' || F.splash) set.add(c);
  // giữ thứ tự trái → phải như lúc đánh
  const ordered = cards.filter((c) => set.has(c));
  return { type, scoring: ordered, contains };
}

// ---------- Tính điểm ----------
// ctx: { held, jokers, levels, handsLeft (kể cả lượt này), discardsLeft, money, jokerSlots,
//        deckRemaining, fullDeck, playedTypes:Set, boss:{flint, debuffSuit, debuffFace}, oops }
function scorePlay(played, ctx) {
  const jokers = ctx.jokers || [];
  const F = ruleFlags(jokers);
  const res = detectHand(played, F);
  const lvl = (ctx.levels && ctx.levels[res.type]) || 1;
  const hi = HAND_INFO[res.type];
  let chips = hi.chips + hi.dc * (lvl - 1);
  let mult = hi.mult + hi.dm * (lvl - 1);
  if (ctx.boss?.flint) { chips = Math.max(0, Math.round(chips / 2)); mult = Math.max(1, Math.round(mult / 2)); }
  let money = 0;
  const odds = ctx.oops ? 2 : 1;
  const resolved = resolveJokers(jokers);
  const effs = resolved.map((r) => r.eff).filter(Boolean);
  const has = (id) => effs.filter((j) => j.id === id).length;
  const isLast = (ctx.handsLeft || 1) <= 1;
  const debuffed = (c) => c.debuffed || (ctx.boss?.debuffSuit && c.enh !== 'stone' && c.enh !== 'wild' && c.suit === ctx.boss.debuffSuit) || (ctx.boss?.debuffFace && isFace(c, F));

  // 1) Lá được tính
  let firstFaceDone = false;
  res.scoring.forEach((c, idx) => {
    if (debuffed(c)) return;
    let reps = 1;
    if (c.seal === 'red') reps++;
    reps += has('hack') * (c.rank >= 2 && c.rank <= 5 && c.enh !== 'stone' ? 1 : 0);
    reps += has('sock_and_buskin') * (isFace(c, F) ? 1 : 0);
    reps += has('hanging_chad') * (idx === 0 ? 2 : 0);
    reps += has('dusk') * (isLast ? 1 : 0);
    reps += has('seltzer');
    for (let r = 0; r < reps; r++) {
      // chip/mult của lá
      chips += (c.enh === 'stone' ? 50 : chipValue(c.rank)) + (c.enh === 'bonus' ? 30 : 0) + (c.bonusChips || 0);
      if (c.enh === 'mult') mult += 4;
      if (c.enh === 'lucky') { mult += 20 * Math.min(1, odds / 5); money += 20 * Math.min(1, odds / 15); }
      if (c.enh === 'glass') mult *= 2;
      if (c.seal === 'gold') money += 3;
      if (c.ed === 'foil') chips += 50;
      if (c.ed === 'holo') mult += 10;
      if (c.ed === 'poly') mult *= 1.5;
      // joker "khi lá được tính"
      for (const j of effs) {
        const suits = effSuits(c, F);
        const face = isFace(c, F);
        switch (j.id) {
          case 'greedy': if (suits.includes('D')) mult += 3; break;
          case 'lusty': if (suits.includes('H')) mult += 3; break;
          case 'wrathful': if (suits.includes('S')) mult += 3; break;
          case 'gluttonous': if (suits.includes('C')) mult += 3; break;
          case 'fibonacci': if ([14, 2, 3, 5, 8].includes(c.rank) && c.enh !== 'stone') mult += 8; break;
          case 'scary_face': if (face) chips += 30; break;
          case 'smiley': if (face) mult += 5; break;
          case 'even_steven': if (c.enh !== 'stone' && c.rank <= 10 && c.rank % 2 === 0) mult += 4; break;
          case 'odd_todd': if (c.enh !== 'stone' && (c.rank === 14 || (c.rank <= 9 && c.rank % 2 === 1))) chips += 31; break;
          case 'scholar': if (c.rank === 14 && c.enh !== 'stone') { chips += 20; mult += 4; } break;
          case 'walkie_talkie': if ((c.rank === 10 || c.rank === 4) && c.enh !== 'stone') { chips += 10; mult += 4; } break;
          case 'arrowhead': if (suits.includes('S')) chips += 50; break;
          case 'onyx_agate': if (suits.includes('C')) mult += 7; break;
          case 'bloodstone': if (suits.includes('H')) mult *= 1 + 0.5 * Math.min(1, odds / 2); break;
          case 'rough_gem': if (suits.includes('D')) money += 1; break;
          case 'photograph': if (face && !firstFaceDone) mult *= 2; break;
          case 'triboulet': if ((c.rank === 12 || c.rank === 13) && c.enh !== 'stone') mult *= 2; break;
          case 'ancient': if (suits.includes(j.suit || 'H')) mult *= 1.5; break;
          case 'idol': if (c.enh !== 'stone' && c.rank === (j.rank || 14) && suits.includes(j.suit || 'S')) mult *= 2; break;
        }
      }
    }
    if (isFace(c, F)) firstFaceDone = true;
  });

  // 2) Lá trên tay
  const held = ctx.held || [];
  held.forEach((c) => {
    if (debuffed(c)) return;
    let reps = 1 + (c.seal === 'red' ? 1 : 0) + has('mime');
    for (let r = 0; r < reps; r++) {
      if (c.enh === 'steel') mult *= 1.5;
      for (const j of effs) {

    if (rs.length) {

      const reps = 1 + (low.seal === 'red' ? 1 : 0) + has('mime');

  const fullDeck = ctx.fullDeck || [];
  const playedTypes = ctx.playedTypes || new Set();
  for (const { src, eff: j } of resolved) {
    if (src.disabled) continue;
    if (src.ed === 'foil') chips += 50;
    if (src.ed === 'holo') mult += 10;
    if (j) {
      const v = Number(j.v) || 0;
      switch (j.id) {
        case 'joker': mult += 4; break;
        case 'jolly': if (C.pair) mult += 8; break;
        case 'zany': if (C.three) mult += 12; break;
        case 'mad': if (C.twoPair) mult += 10; break;
        case 'crazy': if (C.straight) mult += 12; break;
        case 'droll': if (C.flush) mult += 10; break;
        case 'sly': if (C.pair) chips += 50; break;
        case 'wily': if (C.three) chips += 100; break;
        case 'clever': if (C.twoPair) chips += 80; break;
        case 'devious': if (C.straight) chips += 100; break;
        case 'crafty': if (C.flush) chips += 80; break;
        case 'half': if (played.length <= 3) mult += 20; break;
        case 'banner': chips += 30 * (ctx.discardsLeft || 0); break;
        case 'mystic_summit': if ((ctx.discardsLeft || 0) === 0) mult += 15; break;
        case 'misprint': mult += 11.5; break;
        case 'abstract': mult += 3 * nJokers; break;
        case 'gros_michel': mult += 15; break;
        case 'bull': chips += 2 * Math.max(0, ctx.money || 0); break;
        case 'bootstraps': mult += 2 * Math.floor(Math.max(0, ctx.money || 0) / 5); break;
        case 'blue_joker': chips += 2 * (ctx.deckRemaining?.length || 0); break;
        case 'erosion': mult += 4 * Math.max(0, 52 - (fullDeck.length || 52)); break;
        case 'stone_joker': chips += 25 * fullDeck.filter((c) => c.enh === 'stone').length; break;
        case 'supernova': mult += v; break;
        case 'cavendish': mult *= 3; break;
        case 'duo': if (C.pair) mult *= 2; break;
        case 'trio': if (C.three) mult *= 3; break;
        case 'family': if (C.four) mult *= 4; break;
        case 'order': if (C.straight) mult *= 3; break;
        case 'tribe': if (C.flush) mult *= 2; break;
        case 'stencil': mult *= Math.max(1, slots - nJokers + jokers.filter((x) => x.id === 'stencil').length); break;
        case 'card_sharp': if (playedTypes.has(res.type)) mult *= 3; break;
        case 'blackboard': if (held.every((c) => c.enh !== 'stone' && effSuits(c, F).some((s) => s === 'S' || s === 'C'))) mult *= 3; break;
        case 'flower_pot': {
          const ss = new Set(); res.scoring.forEach((c) => effSuits(c, F).forEach((s) => ss.add(s)));

        case 'seeing_double': {

        }
        case 'acrobat': if (isLast) mult *= 3; break;
        case 'steel_joker': mult *= 1 + 0.2 * fullDeck.filter((c) => c.enh === 'steel').length; break;
        case 'drivers_license': if (fullDeck.filter((c) => c.enh).length >= 16) mult *= 3; break;
        case 'loyalty_card': if (v) mult *= 4; break;
        case 'custom': chips += Number(j.chips) || 0; mult += Number(j.mult) || 0; if (Number(j.x)) mult *= Number(j.x); break;
        default:
          if (j.value === 'mult' || JOKER_BY_ID[j.id]?.value === 'mult') mult += v;
          else if (JOKER_BY_ID[j.id]?.value === 'chips') chips += v;
          else if (JOKER_BY_ID[j.id]?.value === 'x') { if (v) mult *= v; }
      }
    }
    if (src.ed === 'poly') mult *= 1.5;
  }
  if (ctx.plasma) { const avg = (chips + mult) / 2; chips = avg; mult = avg; } // Plasma Deck
  const score = Math.floor(chips * mult);
  return { type: res.type, scoringIds: res.scoring.map((c) => c.id), chips: Math.round(chips), mult: Math.round(mult * 100) / 100, score, money };
}

// ---------- Tìm nước ----------
function* subsets(arr, maxK) {
  const n = arr.length;
  for (let mask = 1; mask < 1 << n; mask++) {
    let k = 0; for (let m = mask; m; m &= m - 1) k++;
    if (k > maxK) continue;
    const pick = [], rest = [];
    for (let i = 0; i < n; i++) (mask & (1 << i) ? pick : rest).push(arr[i]);
    yield [pick, rest];
  }
}
function bestPlay(hand, ctx, opts = {}) {
  const must5 = ctx.boss?.psychic;
  let best = null;
  const all = [];
  for (const [pick, rest] of subsets(hand, 5)) {
    if (must5 && pick.length < Math.min(5, hand.length)) continue;
    const r = scorePlay(pick, { ...ctx, held: rest });
    // ưu tiên điểm cao, cùng điểm thì ít lá hơn (giữ lá cho sau)
    const cand = { ...r, cards: pick.map((c) => c.id) };
    if (opts.all) all.push(cand);
    if (!best || r.score > best.score || (r.score === best.score && pick.length < best.cards.length)) best = cand;
  }
  if (opts.all) { all.sort((a, b) => b.score - a.score); return { best, all }; }
  return best;
}
// Nhanh hơn cho Monte Carlo: chỉ cần điểm tốt nhất.
function bestScore(hand, ctx) {
  let best = 0;
  for (const [pick, rest] of subsets(hand, 5)) {
    const s = scorePlay(pick, { ...ctx, held: rest }).score;
    if (s > best) best = s;
  }
  return best;
}

// RNG có seed để kết quả ổn định giữa các lần bấm
function rng(seed) { let s = seed >>> 0 || 1; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
function sample(arr, k, rand) {
  const a = arr.slice(); const out = [];
  for (let i = 0; i < k && a.length; i++) { const j = Math.floor(rand() * a.length); out.push(a[j]); a[j] = a[a.length - 1]; a.pop(); }
  return out;
}

// Ứng viên bỏ bài: giữ một "lõi" (cùng chất, cùng số, chuỗi, tay tốt nhất…), bỏ phần còn lại (≤5 lá).
function discardCandidates(hand, ctx, top) {
  const F = ruleFlags(ctx.jokers || []);
  const keeps = new Map();
  const add = (keep) => {
    const ids = new Set(keep.map((c) => c.id));
    const disc = hand.filter((c) => !ids.has(c.id));
    if (!disc.length) return;
    // quá 5 lá: bỏ 5 lá ít giá trị nhất (số nhỏ, không cải biến)
    const sorted = disc.slice().sort((a, b) => (a.enh || a.ed || a.seal ? 1 : 0) - (b.enh || b.ed || b.seal ? 1 : 0) || a.rank - b.rank);
    const d = sorted.slice(0, 5);
    const key = d.map((c) => c.id).sort().join(',');
    if (!keeps.has(key)) keeps.set(key, d);
  };
  for (const s of SUITS) { const k = hand.filter((c) => effSuits(c, F).includes(s)); if (k.length >= 2) add(k); }
  const groups = {};
  hand.forEach((c) => { if (c.enh !== 'stone') (groups[c.rank] ||= []).push(c); });
  const multi = Object.values(groups).filter((g) => g.length >= 2);
  multi.forEach((g) => add(g));
  if (multi.length >= 2) add(multi.flat());
  // chuỗi: cửa sổ 5 bậc
  for (let lo = 1; lo <= 10; lo++) {
    const win = hand.filter((c) => c.enh !== 'stone' && ((c.rank >= lo && c.rank <= lo + 4) || (lo === 1 && c.rank === 14)));
    const uniq = []; const seen = new Set();
    win.forEach((c) => { const r = c.rank === 14 && lo === 1 ? 1 : c.rank; if (!seen.has(r)) { seen.add(r); uniq.push(c); } });
    if (uniq.length >= 3) add(uniq);
  }
  top.slice(0, 6).forEach((p) => add(hand.filter((c) => p.cards.includes(c.id))));
  // lá mặt / lá cao
  add(hand.filter((c) => isFace(c, F) || c.rank === 14));
  // bỏ từng lá đơn lẻ nhỏ nhất
  const byRank = hand.slice().sort((a, b) => a.rank - b.rank);
  for (let k = 1; k <= Math.min(5, hand.length - 1); k++) add(byRank.slice(k));
  return [...keeps.values()];
}

// Lời khuyên cho một lượt.
// state: { hand, deckRemaining, need (điểm còn thiếu), handsLeft, discardsLeft, handSize, ...ctx }
function advise(state, opts = {}) {
  const t0 = Date.now();
  const ctx = { ...state };
  const hand = state.hand;
  const { best, all } = bestPlay(hand, ctx, { all: true });
  const need = Math.max(0, state.need);
  const H = state.handsLeft, D = state.discardsLeft;
  // phương án khác: mỗi loại tay một dòng, khác tay tốt nhất
  const seenT = new Set([best?.type]);
  const alts = all.filter((x) => (seenT.has(x.type) ? false : (seenT.add(x.type), true))).slice(0, 3);
  const out = { play: best, alternatives: alts, need, ms: 0 };
  if (!best) return { action: 'none', ...out };
  if (best.score >= need || D <= 0 || !state.deckRemaining?.length) {
    out.action = 'play';
    out.reason = best.score >= need ? 'Đủ điểm qua blind ngay lượt này.' : D <= 0 ? 'Hết lượt bỏ — đánh tay mạnh nhất.' : 'Bộ bài đã hết lá để rút.';
    out.ms = Date.now() - t0;
    return out;
  }
  // Monte Carlo cho các phương án bỏ bài
  const rand = rng(opts.seed || 12345);
  const samples = opts.samples || 120;
  const cands = discardCandidates(hand, ctx, all);
  const target = H <= 1 ? need : need / H; // mục tiêu mỗi lượt
  const simulate = (disc, n) => {
    const ids = new Set(disc.map((c) => c.id));
    const keep = hand.filter((c) => !ids.has(c.id));
    const drawN = Math.min(disc.length, state.deckRemaining.length);
    let hit = 0, sum = 0, hitAll = 0;
    for (let i = 0; i < n; i++) {
      const drawn = sample(state.deckRemaining, drawN, rand);
      const s = bestScore([...keep, ...drawn], { ...ctx, discardsLeft: D - 1 });
      sum += Math.min(s, need);
      if (s >= target) hit++;
      if (s >= need) hitAll++;
    }
    return { discard: disc.map((c) => c.id), cards: disc, pTarget: hit / n, pClear: hitAll / n, avg: sum / n };
  };
  // Vòng 1: lọc nhanh; vòng 2: tính kỹ 3 phương án dẫn đầu
  const quick = cands.map((d) => simulate(d, Math.max(30, Math.round(samples / 3))));
  const pre = (e) => e.pClear + 0.5 * Math.min(1, e.avg / need) + 0.3 * e.pTarget;
  quick.sort((a, b) => pre(b) - pre(a));
  const evals = quick.slice(0, 3).map((e) => simulate(e.cards, samples * 3));
  // Giá trị một phương án = khả năng xong blind ngay tay này + tiến độ kỳ vọng (+ đạt mục tiêu mỗi lượt khi còn nhiều tay).
  // Bỏ bài tốn một lượt bỏ: phạt nhẹ, nặng hơn khi còn ít lượt bỏ.
  const wT = H <= 1 ? 0 : 0.3;
  const value = (pClear, avg, pT) => pClear + 0.5 * Math.min(1, avg / need) + wT * pT;
  const penalty = 0.12 / Math.max(1, D);
  evals.forEach((e) => (e.value = value(e.pClear, e.avg, e.pTarget) - penalty));
  evals.sort((a, b) => b.value - a.value);
  const bestD = evals[0];
  const playNowHit = best.score >= target ? 1 : 0;
  const playValue = value(best.score >= need ? 1 : 0, Math.min(best.score, need), playNowHit);
  out.discardOptions = evals.slice(0, 3);
  if (bestD && bestD.value > playValue + 0.03) {
    out.action = 'discard';
    out.discard = bestD;
    out.reason = bestD.pClear >= 0.25
      ? `Bỏ để săn tay đủ điểm luôn: ${Math.round(bestD.pClear * 100)}% xong blind ngay lượt sau.`
      : `Bỏ để tìm tay mạnh hơn: ${Math.round(bestD.pTarget * 100)}% đạt mục tiêu mỗi lượt (${fmt(Math.round(target))}).`;
  } else {
    out.action = 'play';
    out.reason = playNowHit ? `Tay này đạt mục tiêu mỗi lượt (${fmt(Math.round(target))}).` : 'Bỏ bài không cải thiện đáng kể — đánh tay mạnh nhất.';
  }
  out.ms = Date.now() - t0;
  return out;
}

// ---------- Xếp joker ----------
function* permutations(a) {
  if (a.length <= 1) { yield a.slice(); return; }
  for (let i = 0; i < a.length; i++) {
    const rest = a.slice(0, i).concat(a.slice(i + 1));
    for (const p of permutations(rest)) yield [a[i], ...p];
  }
}
// Đánh giá thứ tự joker trên: tay hiện tại + các tay mẫu rút từ bộ bài đầy đủ.
function bestJokerOrder(state, opts = {}) {
  const jokers = state.jokers || [];
  if (jokers.length < 2) return { order: jokers, gain: 0 };
  const rand = rng(opts.seed || 777);
  const pool = state.fullDeck?.length ? state.fullDeck : standardDeck();
  const hs = state.handSize || 8;
  const plays = [];
  const add = (hand) => { const b = bestPlay(hand, state); if (b) plays.push({ cards: hand.filter((c) => b.cards.includes(c.id)), held: hand.filter((c) => !b.cards.includes(c.id)) }); };
  if (state.hand?.length) add(state.hand);
  for (let i = 0; i < (opts.samples || 25); i++) add(sample(pool, hs, rand));
  const evalOrder = (order) => plays.reduce((s, p, i) => s + Math.log(1 + scorePlay(p.cards, { ...state, jokers: order, held: p.held }).score) * (i === 0 && state.hand?.length ? 3 : 1), 0);
  const base = evalOrder(jokers);
  let best = { order: jokers, v: base };
  if (jokers.length <= 6) for (const p of permutations(jokers)) { const v = evalOrder(p); if (v > best.v + 1e-9) best = { order: p, v }; }
  const changed = best.order.some((j, i) => j !== jokers[i]);
  // ước lượng % tăng điểm trên tay hiện tại
  let gain = 0;
  if (changed && state.hand?.length) {
    const a = bestPlay(state.hand, state)?.score || 0;
    const b = bestPlay(state.hand, { ...state, jokers: best.order })?.score || 0;
    gain = a ? b / a - 1 : 0;
  }
  return { order: best.order, changed, gain };
}

// ---------- Sức điểm & shop ----------
// Sức điểm = trung bình hình học điểm tay tốt nhất trên các bàn tay mẫu.
function power(state, opts = {}) {
  const rand = rng(opts.seed || 999);
  const pool = state.fullDeck?.length ? state.fullDeck : standardDeck();
  const hs = state.handSize || 8;
  const n = opts.samples || 40;
  let logSum = 0;
  for (let i = 0; i < n; i++) {
    const h = sample(pool, hs, rand);
    const b = bestScore(h, { ...state, handsLeft: 2, discardsLeft: state.discards ?? 3, money: state.money, deckRemaining: pool });
    logSum += Math.log(1 + b);
  }
  return Math.exp(logSum / n) - 1;
}
function weakestJokerIndex(state) {
  let worst = -1, worstP = Infinity;
  state.jokers.forEach((j, i) => {
    if (j.eternal) return;
    const p = power({ ...state, jokers: state.jokers.filter((_, k) => k !== i) }, { samples: 20 });
    if (p < worstP) { worstP = p; worst = i; }
  });
  return worst;
}
// offers: [{kind:'joker', joker:{id,ed,v,...}, price} | {kind:'planet', hand, price} | {kind:'other', name, price}]
function adviseShop(state, offers, opts = {}) {
  const base = power(state, opts);
  const slots = state.jokerSlots || 5;
  const money = state.money || 0;
  const interestCap = state.interestCap || 25;
  const res = offers.map((o) => {
    let after = base, note = '';
    if (o.kind === 'joker') {
      let js = [...state.jokers];
      const neg = o.joker.ed === 'neg';
      if (!neg && js.length >= slots) {
        const w = weakestJokerIndex(state);
        if (w < 0) return { ...o, gain: 0, note: 'Hết ô, không có joker để bán' };
        note = `thay ${JOKER_BY_ID[js[w].id]?.name || js[w].id}`;
        js.splice(w, 1);
      }
      js.push({ ...o.joker, ed: neg ? null : o.joker.ed });
      const order = bestJokerOrder({ ...state, jokers: js }, { samples: 12 }).order;
      after = power({ ...state, jokers: order, jokerSlots: slots + (neg ? 1 : 0) }, opts);
    } else if (o.kind === 'planet') {
      const levels = { ...(state.levels || {}) };
      levels[o.hand] = (levels[o.hand] || 1) + 1;
      after = power({ ...state, levels }, opts);
    } else {
      return { ...o, gain: null, note: 'Không mô phỏng được — tự cân nhắc' };
    }
    const gain = base ? after / base - 1 : 0;
    // mất lãi nếu tiền tụt qua mốc $5
    const lostInterest = Math.max(0, Math.floor(Math.min(money, interestCap) / 5) - Math.floor(Math.min(Math.max(0, money - o.price), interestCap) / 5));
    return { ...o, gain, after, note, lostInterest, afford: o.price <= money };
  });
  res.sort((a, b) => (b.gain ?? -1) - (a.gain ?? -1));
  return { base, items: res };
}

// Nên skip blind không? needNext = điểm của blind kế tiếp sẽ phải đánh.
const GOOD_TAGS = {
  Negative: 5, Rare: 4, Uncommon: 3, Polychrome: 3, Holographic: 2, Foil: 2, Investment: 4, Economy: 3, Double: 3,
  Voucher: 3, Charm: 2, Meteor: 2, Ethereal: 2, Buffoon: 2, Coupon: 2, D6: 1, Juggle: 1, Garbage: 1, Handy: 2,
  Skip: 1, Speed: 2, 'Top-up': 1, Orbital: 3, Boss: 1, Standard: 1,
};
function adviseSkip(state, blindIdx, tag) {
  const p = power(state, { samples: 30 });
  const hands = state.hands ?? 4;
  const cap = p * hands * 0.75; // ước lượng điểm cả vòng (không phải tay nào cũng tốt nhất)
  const nextReq = blindTarget(state.stakeIdx || 0, state.ante || 1, blindIdx + 1, 2);
  const bossReq = blindTarget(state.stakeIdx || 0, state.ante || 1, 2, 2);
  const tagV = GOOD_TAGS[tag] ?? 1;
  const margin = cap / Math.max(nextReq, bossReq);
  let skip = blindIdx < 2 && margin >= 1.3 && tagV >= 2;
  if (blindIdx < 2 && margin >= 2 && tagV >= 1) skip = true;
  return { skip, power: p, roundCap: cap, nextReq, bossReq, margin, tagValue: tagV };
}

// ---------- Khớp tên mờ (OCR đọc sai vài chữ) ----------
const norm = (s) => s.toLowerCase().replace(/[^a-z0-9]/g, '');
function lev(a, b) {
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
function fuzzyFind(text, list, key = 'name') {
  const t = norm(text); if (t.length < 3) return null;
  let best = null, bestD = Infinity;
  for (const it of list) {
    const k = norm(it[key]); if (!k) continue;
    const d = lev(t, k);
    const tol = k.length <= 5 ? 0 : k.length <= 9 ? 1 : 2;
    if (d <= tol && d < bestD) { best = it; bestD = d; }
  }
  return best;
}

// ---------- Đọc màn hình từ OCR ----------
// lines: [{t, box:[x,y,w,h]}], W,H kích thước ảnh. Trả về loại màn hình + dữ liệu đọc được.
function parseScreen(lines, W, H) {
  const has = (re) => lines.some((l) => re.test(l.t));
  const find = (re) => lines.find((l) => re.test(l.t));
  const out = { screen: 'unknown', tooltip: null, prices: [], packName: null };
  const isRound = has(/play\s*hand|sort\s*hand/i);
  const isShop = has(/reroll|next\s*round/i);
  // màn mở pack: có "Choose N" hoặc "Skip" + tên pack trên cùng một dòng (shop chỉ có chữ PACK rời trên hình bao)
  const packLine = lines.find((l) => /(buffoon|arcana|celestial|standard|spectral)\s*pack/i.test(l.t));
  const isPack = has(/choose\s*\d/i) || (has(/^\s*skip\s*$/i) && !!packLine);
  const isBlindSelect = lines.filter((l) => /^select$/i.test(l.t.trim())).length >= 1 && !isRound;
  out.screen = isRound ? 'round' : isPack ? 'pack' : isShop ? 'shop' : isBlindSelect ? 'blind' : 'unknown';
  if (isPack) {
    const nm = packLine ? packLine.t.replace(/pack/i, ' Pack').replace(/\s+/g, ' ').trim() : '';
    const p = PACKS.find((p) => norm(nm).includes(p.type)) || null;
    out.packName = p ? p.name : null; out.packType = p ? p.type : null;
    const ch = find(/choose\s*(\d)/i); out.choose = ch ? +ch.t.match(/(\d)/)[1] : 1;
  }
  // Điểm cần + tên blind
  const sal = find(/score\s*at\s*least/i);
  if (sal) {
    const num = lines.filter((l) => /^[\d,.]+$/.test(l.t.replace(/\s/g, '')) && l.box[1] > sal.box[1] && l.box[1] < sal.box[1] + sal.box[3] * 4 && Math.abs((l.box[0] + l.box[2] / 2) - (sal.box[0] + sal.box[2] / 2)) < sal.box[2])
      .sort((a, b) => a.box[1] - b.box[1])[0];
    if (num) out.target = parseInt(num.t.replace(/[^\d]/g, ''), 10);
  }
  if (has(/small\s*blind/i)) out.blind = 0; else if (has(/big\s*blind/i)) out.blind = 1;
  else { const b = lines.map((l) => fuzzyFind(l.t, BOSS_NAMES.map((n) => ({ name: n })))).find(Boolean); if (b) { out.blind = 2; out.boss = b.name; } }
  const ante = lines.find((l) => /^\s*(\d{1,2})\s*\/\s*8\s*$/.test(l.t) && l.box[0] < W * 0.3);
  if (ante) out.ante = +ante.t.match(/(\d{1,2})/)[1];
  // Tiền: "$N" ở cột trái
  const money = lines.find((l) => /^\$\s*\d+$/.test(l.t.trim()) && l.box[0] + l.box[2] < W * 0.3);
  if (money) out.money = +money.t.replace(/[^\d]/g, '');
  // Giá: "$N" ngoài cột trái
  out.prices = lines.filter((l) => /^\$\s*\d+$/.test(l.t.trim()) && l.box[0] > W * 0.3).map((l) => ({ v: +l.t.replace(/[^\d]/g, ''), box: l.box }));
  const reroll = find(/reroll\s*\$?\s*(\d+)/i); if (reroll) out.reroll = +reroll.t.match(/(\d+)/)[1];
  // Bảng mô tả (tooltip): một dòng khớp tên món
  for (const l of lines) {
    // chữ trên hình (JOKER, BUFFOON, VOUCHER…) viết hoa toàn bộ; tên trong bảng mô tả thì không
    if (/[A-Z]{4,}/.test(l.t) && l.t === l.t.toUpperCase()) continue;
    const it = fuzzyFind(l.t, CATALOG);
    if (it && it.kind !== 'pack') {
      out.tooltip = { ...it, box: l.box };
      break;
    }
    const pc = l.t.match(/^(ace|king|queen|jack|10|[2-9])\s*of\s*(spades|hearts|clubs|diamonds)$/i);
    if (pc) {
      const rk = { ace: 14, king: 13, queen: 12, jack: 11 }[pc[1].toLowerCase()] || +pc[1];
      out.tooltip = { kind: 'card', name: l.t, rank: rk, suit: pc[2][0].toUpperCase(), box: l.box };
      break;
    }
  }
  if (out.tooltip) {
    for (const l of lines) {
      const t = l.t.trim();
      for (const [k, v] of Object.entries(ED_NAMES)) if (norm(t) === norm(k)) out.tooltip.ed = v;
      for (const [k, v] of Object.entries(ENH_NAMES)) if (norm(t) === norm(k)) out.tooltip.enh = v;
      for (const [k, v] of Object.entries(SEAL_NAMES)) if (norm(t) === norm(k)) out.tooltip.seal = v;
    }
    // giá gần bảng mô tả nhất (khoảng cách thật); quá xa thì không gán — dùng giá mặc định
    const cx = (b) => b[0] + b[2] / 2, cy = (b) => b[1] + b[3] / 2;
    const d = (b) => Math.hypot(cx(b) - cx(out.tooltip.box), cy(b) - cy(out.tooltip.box));
    const p = out.prices.slice().sort((a, b) => d(a.box) - d(b.box))[0];
    if (p && out.screen === 'shop' && d(p.box) < H * 0.3) out.tooltip.price = p.v;
  }
  return out;
}

// ---------- Tay chính + giá trị ----------
function mainHand(state) {
  const counts = state.handCounts || {};
  let best = 'Pair', bv = -1;
  for (const [n] of HAND_TYPES) {
    const lvl = state.levels?.[n] || 1;
    const v = (lvl - 1) * 3 + (counts[n] || 0);
    if (v > bv) { bv = v; best = n; }
  }
  return bv > 0 ? best : null;
}
function interestOf(m, cap) { return Math.floor(Math.min(Math.max(0, m), cap) / 5); }

function packValue(item, state) {
  const p = PACKS.find((x) => x.type === item.type) || PACKS[0];
  const bonus = item.size === 'mega' ? 1.5 : item.size === 'jumbo' ? 0.7 : 0;
  const free = (state.jokerSlots || 5) - (state.jokers?.length || 0);
  let v = 0, why = '';
  if (p.type === 'buffoon') { v = free > 0 ? (state.ante <= 4 ? 3.5 : 2.5) : 1.5; why = free > 0 ? 'còn ô joker' : 'hết ô joker, phải bán để lấy'; }
  else if (p.type === 'celestial') { v = mainHand(state) ? 3 : 2; why = mainHand(state) ? `tăng level ${mainHand(state)}` : 'chưa có tay chính'; }
  else if (p.type === 'arcana') { v = 2.5; why = 'tarot chỉnh bộ bài'; }
  else if (p.type === 'spectral') { v = 2.2; why = 'mạnh nhưng có cái giá'; }
  else { v = 1.2; why = 'thường ít giá trị'; }
  return { v: v + bonus, why };
}


// Điểm cho một joker đã mô phỏng: lấy mức tăng điểm; joker kinh tế/tích lũy có giá trị sàn
function rateJoker(ref, gain, note) {
  const def = JOKER_BY_ID[ref.id || jokerIdByName(ref.name)] || {};
  let score = (gain || 0) * 10;
  let why = `+${Math.round((gain || 0) * 100)}% điểm mỗi tay`;
  if (def.passive && score < 2.5) { score = 2.5; why = def.vi + (gain > 0.05 ? ` · ${why}` : ''); }
  if (['mult', 'chips', 'x'].includes(def.value) && !ref.v && score < 3) { score = 3; why = 'tăng dần theo thời gian'; }
  if (ref.ed === 'neg') { score += 3; why += ' · Negative: không tốn ô'; }
  if (note) why += ` · ${note}`;
  return { score, why };
}

// Khuyên shop đầy đủ. items: [{kind, name, id?, price, ed?, hand?, type?, size?}]
function adviseShopFull(state, items, opts = {}) {
  const money = state.money || 0;
  const cap = state.interestCap ?? 25;
  const jk = items.filter((i) => i.kind === 'joker' || i.kind === 'planet');
  const sim = jk.length ? adviseShop(state, jk.map((i) => i.kind === 'joker'
    ? { kind: 'joker', joker: { id: i.id || jokerIdByName(i.name) || 'passive', ed: i.ed || null }, price: i.price, ref: i }
    : { kind: 'planet', hand: i.hand || PLANETS.find((p) => p.name === i.name)?.hand, price: i.price, ref: i }), opts) : { base: power(state, opts), items: [] };
  const base = sim.base;
  const rated = [];
  for (const r of sim.items) {
    const it = r.ref;
    const { score, why } = it.kind === 'joker' ? rateJoker(it, r.gain, null) : { score: (r.gain || 0) * 10, why: `+${Math.round((r.gain || 0) * 100)}% điểm mỗi tay` };
    rated.push({ ...it, score, why, note: r.note });
  }
  for (const it of items) {
    if (it.kind === 'voucher') {
      const v = VOUCHERS.find((x) => x.name === it.name);
      let s = v ? v.v : 1;
      if ((it.name === 'Seed Money' || it.name === 'Money Tree') && money < 30) s -= 1.5;
      if (it.name === 'Observatory' && !mainHand(state)) s -= 2;
      rated.push({ ...it, score: s * 2, why: v ? v.vi : '' });
    } else if (it.kind === 'pack') {
      const pv = packValue(it, state); rated.push({ ...it, score: pv.v * 2, why: pv.why });
    } else if (it.kind === 'tarot' || it.kind === 'spectral') {
      const d = (it.kind === 'tarot' ? TAROTS : SPECTRALS).find((x) => x.name === it.name);
      let s = d ? d.v : 1;
      if (d?.money === 'hermit') s = Math.min(20, money - (it.price || 3)) / 4;
      rated.push({ ...it, score: s * 1.6, why: d ? d.vi : '' });
    }
  }
  rated.sort((a, b) => b.score - a.score);
  // Lập kế hoạch mua: món đáng (score ≥ ngưỡng) theo thứ tự; giữ mốc lãi khi món không đủ đáng
  const plan = []; let m = money;
  const slotsFree = (state.jokerSlots || 5) - (state.jokers?.length || 0);
  let jokersBought = 0;
  for (const it of rated) {
    if (!it.price && it.price !== 0) continue;
    if (it.price > m) { plan.push({ ...it, act: 'skip', why2: 'không đủ tiền' }); continue; }
    const lost = interestOf(m, cap) - interestOf(m - it.price, cap);
    const threshold = 3 + lost * 1.5 + (state.ante >= 7 ? -2 : 0); // cuối ván tiền ít giá trị
    if (it.kind === 'joker' && slotsFree - jokersBought <= 0 && it.ed !== 'neg' && !it.note) { plan.push({ ...it, act: 'skip', why2: 'hết ô joker' }); continue; }
    if (it.score >= threshold) {
      plan.push({ ...it, act: 'buy', why2: lost ? `mất $${lost} lãi/vòng nhưng đáng` : '' });
      m -= it.price; if (it.kind === 'joker') jokersBought++;
    } else plan.push({ ...it, act: 'skip', why2: lost ? `không đáng mất $${lost} lãi` : 'giá trị thấp' });
  }
  const rr = opts.reroll ?? state.reroll ?? 5;
  const bestLeft = plan.filter((p) => p.act === 'skip').reduce((a, r) => Math.max(a, r.score), 0);

  }
  // Dạy app nhận lá chưa chắc: chọn số + chất một lần
  function labelQueue(list, autoAdvise) {
    const host = $('#sheetHost');
    if (!list.length) {
      host.innerHTML = '';
      S.hand.sort((a, b) => ((scanBoxes[a.id] || [1e9])[0]) - ((scanBoxes[b.id] || [1e9])[0]));
      save(); render(); if (autoAdvise) runAdvice(); return;
    }
    const c = list[0]; let rk = null;
    host.innerHTML = `<div class="sheet" role="dialog" aria-label="Dạy nhận lá">
      <div class="sec"><h2>Lá này là gì?</h2><small>còn ${list.length} lá · dạy 1 lần</small></div>
      ${c.img ? `<img src="${c.img}" alt="Lá bài cắt từ màn hình">` : ''}
      <div class="ranks">${E.RANKS.map((r) => `<button class="k" data-lr="${r}">${E.RANK_LABEL[r]}</button>`).join('')}</div>
      <div class="suits">${E.SUITS.map((s) => `<button class="k suit-${s}" data-ls="${s}" aria-label="Chất ${s}">${E.SUIT_SYM[s]}</button>`).join('')}</div>
      <button class="btn ghost" id="lblSkip">Bỏ qua lá này</button></div>`;
    host.querySelectorAll('[data-lr]').forEach((b) => (b.onclick = () => { rk = +b.dataset.lr; host.querySelectorAll('[data-lr]').forEach((x) => x.classList.toggle('on', x === b)); }));
    host.querySelectorAll('[data-ls]').forEach((b) => (b.onclick = () => {
      if (!rk) return toast('Chọn số trước');
      Bridge && Bridge.learn && Bridge.learn(c.tid, rk, b.dataset.ls);
      const h = takeDeckCard(rk, b.dataset.ls); S.hand.push(h); scanBoxes[h.id] = c.box;
      labelQueue(list.slice(1), autoAdvise);
    }));
    $('#lblSkip').onclick = () => labelQueue(list.slice(1), autoAdvise);
  }
  function doScan() { if (Bridge && Bridge.scan) Bridge.scan(S.handSize || 8); }

  // ---------- Hiển thị ----------
  const isRed = (s) => s === 'H' || s === 'D';
  const cardChip = (h) => `<span class="chipcard ${isRed(h.suit) ? 'red' : ''}">${h.enh === 'stone' ? 'Stone' : E.RANK_LABEL[h.rank] + E.SUIT_SYM[h.suit]}</span>`;
  function cardHTML(h, extra) {
    const stone = h.enh === 'stone';
    return `<button class="card ${isRed(h.suit) ? 'red' : ''} ${h.ed ? 'ed-' + h.ed : ''} ${extra}" data-card="${h.id}" aria-label="${stone ? 'Stone' : E.RANK_LABEL[h.rank] + ' ' + h.suit}">
      ${stone ? '<span>◼</span>' : `<span>${E.RANK_LABEL[h.rank]}</span><span class="s">${E.SUIT_SYM[h.suit]}</span>`}
      ${h.enh && !stone ? `<span class="tg">${h.enh}</span>` : ''}${h.seal ? `<span class="seal" style="background:${SEAL_COLOR[h.seal]}"></span>` : ''}</button>`;
  }
  const opts = (list, v) => list.map(([k, l]) => `<option value="${k}" ${String(v ?? '') === String(k) ? 'selected' : ''}>${l}</option>`).join('');
  const actionRow = (askLabel, askId) => `<div class="actions ${Bridge ? '' : 'one'}">${Bridge ? '<button class="btn primary" id="scan">Quét màn hình</button>' : ''}<button class="btn ${Bridge ? '' : 'primary'}" id="${askId}">${askLabel}</button></div>`;

  function viewRound() {
    const a = advice;
    const playIds = new Set(a && a.action === 'play' ? a.play.cards : []);
    const discIds = new Set(a && a.action === 'discard' ? a.discard.discard : []);
    const sel = S.hand.find((h) => h.id === S.selCard);
    let res = '';
    if (a && a.play) {
      const p = a.play;
      const jo = a.jokerOrder && a.jokerOrder.changed ? `<p class="why">Xếp lại joker: ${a.jokerOrder.order.map((j) => esc(E.JOKER_BY_ID[j.id]?.name || j.id)).join(' → ')} (+${Math.round(a.jokerOrder.gain * 100)}%) <button class="btn small" id="applyOrder">Áp dụng</button></p>` : '';
      if (a.action === 'play') {
        const cs = S.hand.filter((h) => playIds.has(h.id));
        res = `<div class="result play"><div class="verdict">ĐÁNH ${cs.length} LÁ · ${esc(p.type)}</div>
          <div class="cards-inline">${cs.map(cardChip).join('')}</div>
          <div class="score"><span class="c">${E.fmt(p.chips)}</span> × <span class="m">${E.fmt(p.mult)}</span> = <b>${E.fmt(p.score)}</b></div>
          <p class="why">${esc(a.reason)}</p>${jo}
          ${a.alternatives?.length ? `<div class="alts">${a.alternatives.map((x) => `<div><span>${esc(x.type)}</span><span class="score">${E.fmt(x.score)}</span></div>`).join('')}</div>` : ''}
          <button class="btn go" id="doIt">Đã đánh xong</button></div>`;
      } else if (a.action === 'discard') {
        const cs = S.hand.filter((h) => discIds.has(h.id));
        res = `<div class="result discard"><div class="verdict">BỎ ${cs.length} LÁ</div>
          <div class="cards-inline">${cs.map(cardChip).join('')}</div>
          <p class="why">${esc(a.reason)} Kỳ vọng sau khi rút: ~${E.fmt(a.discard.avg)} điểm. Nếu đánh ngay: ${esc(p.type)} ${E.fmt(p.score)}.</p>${jo}
          <button class="btn danger" id="doIt">Đã bỏ xong</button></div>`;
      }
    }
    return `
      ${actionRow('Gợi ý nước đi', 'ask')}
      <div id="adviceBox">${res}</div>
      <div class="sec"><h2>Tay bài</h2><small>${S.hand.length}/${S.handSize} lá · còn ${deckRemaining().length} trong bộ</small></div>
      <div class="hand">${S.hand.length ? S.hand.map((h) => cardHTML(h, `${h.id === S.selCard ? 'sel' : ''} ${playIds.has(h.id) ? 'play' : ''} ${discIds.has(h.id) ? 'disc' : ''}`)).join('') : `<div class="empty">${Bridge ? 'Mở game ở lúc đang cầm bài rồi bấm Quét.' : 'Mở "Nhập tay" bên dưới để thêm lá.'}</div>`}</div>
      ${sel ? `<div class="mods">
        <label class="f">Enhancement<select class="sel" id="mEnh">${opts(ENH, sel.enh)}</select></label>
        <label class="f">Edition<select class="sel" id="mEd">${opts(EDS, sel.ed)}</select></label>
        <label class="f">Seal<select class="sel" id="mSeal">${opts(SEALS, sel.seal)}</select></label></div>
        <div class="row"><button class="btn danger small" id="rmCard">Xóa lá</button><button class="btn small" id="deselect">Xong</button></div>` : ''}
      <details class="pad" ${Bridge ? '' : 'open'}><summary>Nhập tay / sửa lá</summary><div class="padin">
        <div class="ranks">${E.RANKS.map((r) => `<button class="k ${S.pickRank === r ? 'on' : ''}" data-rank="${r}">${E.RANK_LABEL[r]}</button>`).join('')}<button class="k wide" id="clearHand">Xóa tay</button></div>
        <div class="suits">${E.SUITS.map((s) => `<button class="k suit-${s}" data-suit="${s}" aria-label="Chất ${s}">${E.SUIT_SYM[s]}</button>`).join('')}</div>
        <p class="note">Chạm số rồi chạm chất để thêm lá. Chạm một lá trên tay để đổi Enhancement / Edition / Seal.</p>
      </div></details>
      ${S.blind === 2 ? `<div class="sec"><h2>Luật Boss${S.bossName ? ': ' + esc(S.bossName) : ''}</h2></div>
      <div class="grid2">
        <label class="f"><span><input type="checkbox" id="bFlint" ${S.boss.flint ? 'checked' : ''}> The Flint (gốc ½)</span></label>
        <label class="f"><span><input type="checkbox" id="bPsy" ${S.boss.psychic ? 'checked' : ''}> The Psychic (5 lá)</span></label>
        <label class="f"><span><input type="checkbox" id="bFace" ${S.boss.debuffFace ? 'checked' : ''}> The Plant (lá mặt)</span></label>
        <label class="f">Vô hiệu chất<select class="sel" id="bSuit">${opts([['', 'Không'], ['S', '♠ The Goad'], ['H', '♥ The Head'], ['C', '♣ The Club'], ['D', '♦ The Window']], S.boss.debuffSuit)}</select></label>
      </div>` : ''}
      <div class="row"><button class="btn grow" id="nextBlind">Thắng blind → sang shop</button><button class="btn ghost" id="resetRound">Làm lại vòng</button></div>`;
  }

  let sq = '';
  function searchResults(q) {
    const n = q.trim().toLowerCase(); if (!n) return '';
    return E.CATALOG.filter((x) => x.name.toLowerCase().includes(n) || (x.vi || '').toLowerCase().includes(n)).slice(0, 30)
      .map((x, i) => `<button data-cat="${E.CATALOG.indexOf(x)}"><span class="kind">${E.KIND_VI[x.kind]}</span> <b>${esc(x.name)}</b><small>${esc(x.vi || '')}</small></button>`).join('');
  }
  function itemRow(o, i, where) {
    const label = o.kind === 'card' ? `${E.RANK_LABEL[o.rank] || ''}${E.SUIT_SYM[o.suit] || ''} ${[o.enh, o.seal && o.seal + ' seal', o.ed].filter(Boolean).join(' · ')}` : o.name;
    return `<div class="item"><div class="nm"><span class="kind">${E.KIND_VI[o.kind] || ''}</span><b>${esc(label)}</b></div><div class="ctl">
      ${o.kind === 'joker' ? `<select class="sel" style="width:auto" data-ied="${where}:${i}" aria-label="Edition">${opts(JEDS, o.ed)}</select>` : ''}
      ${where === 'shop' ? `<label class="note">$<input type="number" inputmode="numeric" data-iprice="${i}" value="${o.price ?? ''}" aria-label="Giá"></label>` : ''}
      <button class="ib" data-idel="${where}:${i}" aria-label="Xóa">✕</button></div></div>`;
  }
  function viewShop() {
    const cap = ctxBase().interestCap;
    let shopRes = '';
    if (shopAdvice) {
      const buys = shopAdvice.plan.filter((p) => p.act === 'buy');
      shopRes = `<div class="result info"><div class="verdict">${buys.length ? `MUA ${buys.length} MÓN` : 'KHÔNG MUA GÌ'}</div>
        <div class="plan">${shopAdvice.plan.map((p, i) => `<div class="step ${p.act}"><span class="tag">${p.act === 'buy' ? 'MUA' : 'BỎ QUA'}</span>
          <div><b>${esc(p.name)} <span class="price">$${p.price ?? '?'}</span></b><small>${esc(p.why)}${p.why2 ? ' · ' + esc(p.why2) : ''}</small></div>
          ${p.act === 'buy' ? `<button class="btn small go" data-bought="${i}">Đã mua</button>` : '<span></span>'}</div>`).join('')}</div>
        ${shopAdvice.reroll ? `<div class="step buy"><span class="tag">REROLL</span><div><b>Reroll <span class="price">$${shopAdvice.reroll.cost}</span></b><small>${esc(shopAdvice.reroll.why)}</small></div><span></span></div>` : ''}
        <p class="why">Sau đó bấm <b>Next Round</b>. Còn khoảng $${shopAdvice.moneyAfter} → lãi +$${shopAdvice.interest}/vòng.</p></div>`;
    }
    let packRes = '';
    if (packAdvice) {
      packRes = packAdvice.skip ? `<div class="result info"><div class="verdict">BỎ QUA PACK</div><p class="why">Không lá nào đáng lấy — bấm Skip trong game.</p></div>`
        : `<div class="result play"><div class="verdict">CHỌN ${packAdvice.picks.map((p) => esc(p.kind === 'card' ? `${E.RANK_LABEL[p.rank]}${E.SUIT_SYM[p.suit]}` : p.name)).join(' + ')}</div>
        <div class="plan">${packAdvice.rated.map((p, i) => `<div class="step ${packAdvice.picks.includes(p) ? 'pick' : 'skip'}"><span class="tag">${packAdvice.picks.includes(p) ? 'CHỌN' : '—'}</span>
          <div><b>${esc(p.kind === 'card' ? `${E.RANK_LABEL[p.rank]}${E.SUIT_SYM[p.suit]} ${p.enh || ''}` : p.name)}</b><small>${esc(p.why)}${p.targets?.length ? ' · dùng lên: ' + p.targets.map((id) => { const h = S.hand.find((x) => x.id === id); return h ? E.RANK_LABEL[h.rank] + E.SUIT_SYM[h.suit] : ''; }).join(' ') : ''}</small></div>
          ${packAdvice.picks.includes(p) ? `<button class="btn small go" data-picked="${i}">Đã chọn</button>` : '<span></span>'}</div>`).join('')}</div></div>`;
    }
    return `
      ${actionRow(S.pack ? 'Chọn lá nào?' : 'Nên mua gì?', S.pack ? 'ratePack' : 'rateShop')}
      ${S.pack ? `<div class="sec"><h2>Đang mở: ${esc(E.PACKS.find((p) => p.type === S.pack.type)?.name || 'Pack')}</h2><small>chọn ${S.pack.choose}</small></div>
        <div id="packOut">${packRes}</div>
        <div class="list">${S.pack.options.length ? S.pack.options.map((o, i) => itemRow(o, i, 'pack')).join('') : '<div class="empty">Trong game, chạm từng lá trong pack để hiện mô tả, rồi bấm Quét.</div>'}</div>
        <div class="row"><button class="btn small ghost" id="closePack">Đóng pack (về shop)</button></div>` : ''}
      ${!S.pack ? `<div id="shopOut">${shopRes}</div>` : ''}
      <div class="sec"><h2>Món trong shop</h2><small>$${S.money} · lãi tối đa $${cap}</small></div>
      <div class="list">${S.shopItems.length ? S.shopItems.map((o, i) => itemRow(o, i, 'shop')).join('') : '<div class="empty">Trong game, chạm một món để hiện mô tả rồi bấm Quét — app đọc tên và giá. Hoặc tìm và thêm bên dưới.</div>'}</div>
      <div class="row"><label class="note">Giá reroll $<input class="sel" style="width:70px;display:inline-block" type="number" inputmode="numeric" id="rerollIn" value="${S.reroll}"></label><button class="btn small ghost" id="clearShop">Xóa danh sách shop</button></div>
      <div class="seg" role="tablist" aria-label="Thêm vào"><button class="${S.addTo === 'shop' ? 'on' : ''}" data-addto="shop">Thêm vào shop</button><button class="${S.addTo === 'pack' ? 'on' : ''}" data-addto="pack">Thêm vào pack</button></div>
      <input class="search" id="sq" placeholder="Tìm: joker, tarot, planet, voucher, pack…" value="${esc(sq)}" autocomplete="off">
      <div class="results" id="sres">${searchResults(sq)}</div>
      <div class="sec"><h2>Có nên skip blind?</h2></div>
      <div class="row"><select class="sel" style="width:auto;flex:1" id="tagSel">${Object.keys(E.GOOD_TAGS).map((t) => `<option ${t === S.skipTag ? 'selected' : ''}>${t}</option>`).join('')}</select>
        <button class="btn small" id="rateSkip">Đánh giá skip ${BLIND_VI[S.blind]}</button></div>
      <div id="skipOut">${skipResult || ''}</div>`;
  }

  let jq = '';
  function viewJokers() {
    const jres = jq.trim() ? E.JOKERS.filter((j) => j.name.toLowerCase().includes(jq.toLowerCase()) || j.vi.toLowerCase().includes(jq.toLowerCase())).slice(0, 30)
      .map((j) => `<button data-jadd="${j.id}"><b>${esc(j.name)}</b><small>${esc(j.vi)}</small></button>`).join('') : '';

          : d.value === 'chat' ? `<select class="sel" style="width:auto" data-jf="suit" data-ji="${i}">${opts(E.SUITS.map((s) => [s, E.SUIT_SYM[s]]), j.suit || 'H')}</select>`
          : d.value === 'la' ? `<select class="sel" style="width:auto" data-jf="rank" data-ji="${i}">${opts(E.RANKS.map((r) => [String(r), E.RANK_LABEL[r]]), String(j.rank || 14))}</select><select class="sel" style="width:auto" data-jf="suit" data-ji="${i}">${opts(E.SUITS.map((s) => [s, E.SUIT_SYM[s]]), j.suit || 'S')}</select>`
          : d.value === 'kichHoat' ? `<label class="note"><input type="checkbox" data-jf="v" data-ji="${i}" ${j.v ? 'checked' : ''}> đang ×4</label>`
          : d.value ? `<input data-jf="v" data-ji="${i}" type="number" step="0.1" placeholder="${d.value === 'x' ? '×' : '+'}" value="${j.v ?? ''}" aria-label="Giá trị hiện tại">` : '';
        return `<div class="item"><div class="nm"><b>${i + 1}. ${esc(d.name)}</b><small>${esc(d.vi)}</small></div><div class="ctl">${val}
          <select class="sel" style="width:auto" data-jf="ed" data-ji="${i}" aria-label="Edition">${opts(JEDS, j.ed)}</select>
          <button class="ib" data-jmove="${i}" data-d="-1" aria-label="Sang trái">↑</button><button class="ib" data-jmove="${i}" data-d="1" aria-label="Sang phải">↓</button><button class="ib" data-jdel="${i}" aria-label="Bán / xóa">✕</button></div></div>`;
      }).join('') : '<div class="empty">Chưa có joker. Tìm và thêm bên dưới.</div>'}</div>
      <button class="btn" id="optOrder">Xếp thứ tự tối ưu</button>
      <input class="search" id="jq" placeholder="Tìm joker theo tên hoặc hiệu ứng…" value="${esc(jq)}" autocomplete="off">
      <div class="results" id="jres">${jres}</div>
      <p class="note">Joker tích lũy (Ride the Bus, Hologram…) nhập giá trị hiện tại vào ô số. Joker chưa có trong danh sách: chọn "Joker khác (tự nhập)".</p>`;
  }

  function viewSetup() {
    const deck = fullDeck(); const ids = new Set(deck.map((c) => c.id)); const inHand = new Set(S.hand.map((h) => h.deckId));
    return `
      <div class="sec"><h2>Ván chơi</h2></div>
      <label class="f">Deck<select class="sel" id="deckSel">${E.DECKS.map((d) => `<option value="${d.id}" ${d.id === S.deckType ? 'selected' : ''}>${d.name} — ${d.vi}</option>`).join('')}</select></label>
      <div class="grid2">
        <label class="f">Stake<select class="sel" id="stake">${E.STAKES.map((s, i) => `<option value="${i}" ${i === S.stakeIdx ? 'selected' : ''}>${s}</option>`).join('')}</select></label>
        <label class="f">Số lá trên tay<input class="sel" id="hsize" type="number" value="${S.handSize}"></label>
