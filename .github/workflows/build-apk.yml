name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test bộ não + ghép trang vào app
        run: |
          node test/engine.test.mjs
          node test/catalog.test.mjs
          node build.mjs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Đổi tên APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk BalatroAdvisor.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BalatroAdvisor-apk
          path: BalatroAdvisor.apk

      - name: Đăng lên Releases (bản mới nhất)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest BalatroAdvisor.apk \
            --title "Balatro Advisor — bản mới nhất" \
            --notes "Tải BalatroAdvisor.apk về điện thoại Android và cài. Build từ commit ${GITHUB_SHA::7}."
