<title>Balatro Advisor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Bố cục: bảng hẹp nổi cạnh game. Trên = trạng thái blind (2 dòng), giữa = hành động + gợi ý, dưới = 4 tab. */
:root {
  --felt: #0e2420;      /* nền */
  --panel: #163a33;     /* khối nổi */
  --panel-2: #1f4a41;   /* nút, ô nhập */
  --line: #2f5f54;
  --ink: #f1f5f2;
  --muted: #a9c2b9;
  --chips: #3d8fe6;     /* chip (xanh dương như game) */
  --mult: #ef5056;      /* mult (đỏ như game) */
  --gold: #f0bd45;      /* tiền */
  --go: #4fd096;        /* nên làm */
  --paper: #f5f2ea;
  --paper-ink: #1b1b1d;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
  --num: ui-monospace, "SF Mono", "Roboto Mono", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--felt); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.4; }
* { box-sizing: border-box; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

.app { height: 100%; display: flex; flex-direction: column; max-width: 600px; margin: 0 auto; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; padding-block: 12px 20px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px; }
.scroll > * { flex-shrink: 0; }

/* Trạng thái */
.status { background: var(--panel); border-bottom: 1px solid var(--line); padding-block: 8px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); display: grid; gap: 8px; }
.row1 { display: flex; align-items: center; gap: 10px; }
.blindbtn { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-weight: 600; white-space: nowrap; }
.prog { flex: 1; min-width: 0; display: grid; gap: 3px; }
.prog .bar { height: 6px; background: var(--felt); border-radius: 3px; overflow: hidden; }
.prog .bar i { display: block; height: 100%; width: 0; background: var(--go); }
.prog .nums { font-family: var(--num); font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prog .need { color: var(--mult); }
.row2 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.ctr { display: flex; align-items: center; justify-content: space-between; background: var(--felt); border-radius: 8px; padding: 2px; }
.ctr span { font-size: 13px; color: var(--muted); padding-left: 6px; }
.ctr b { font-family: var(--num); font-size: 17px; min-width: 2.2ch; text-align: center; }
.ctr.h b { color: var(--chips); } .ctr.d b { color: var(--mult); } .ctr.m b { color: var(--gold); }
.ctr button { width: 30px; height: 30px; border: 0; border-radius: 6px; background: var(--panel-2); font-size: 18px; line-height: 1; }

/* Nút */
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.actions.one { grid-template-columns: 1fr; }
.btn { min-height: 46px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); font-weight: 600; font-size: 16px; }
.btn.small { min-height: 38px; font-size: 14px; padding: 0 10px; }
.btn.primary { background: var(--gold); border-color: var(--gold); color: #2a1f05; }
.btn.go { background: var(--go); border-color: var(--go); color: #05281a; }
.btn.danger { background: transparent; border-color: var(--mult); color: #ff9da1; }
.btn.ghost { background: transparent; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > .grow { flex: 1; }

/* Thẻ kết quả */
.result { background: var(--panel); border: 2px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 8px; }
.result.play { border-color: var(--go); } .result.discard { border-color: var(--mult); } .result.info { border-color: var(--gold); }
.verdict { font-size: 22px; font-weight: 800; letter-spacing: .01em; }
.result.play .verdict { color: var(--go); } .result.discard .verdict { color: var(--mult); } .result.info .verdict { color: var(--gold); }
.cards-inline { display: flex; flex-wrap: wrap; gap: 6px; }
.chipcard { background: var(--paper); color: var(--paper-ink); border-radius: 6px; padding: 2px 8px; font-weight: 700; font-family: var(--num); }
.chipcard.red { color: #c8242d; }
.score { font-family: var(--num); font-variant-numeric: tabular-nums; font-size: 15px; }
.score .c { background: var(--chips); color: #fff; padding: 1px 6px; border-radius: 4px; }
.score .m { background: var(--mult); color: #fff; padding: 1px 6px; border-radius: 4px; }
.why { color: var(--muted); margin: 0; font-size: 15px; }
.alts { display: grid; gap: 4px; font-size: 14px; color: var(--muted); }
.alts div { display: flex; justify-content: space-between; gap: 8px; border-top: 1px solid var(--line); padding-top: 4px; }

/* Danh sách hành động shop */
.plan { display: grid; gap: 6px; }
.step { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; background: var(--felt); border-radius: 10px; padding: 8px 10px; }
.step .tag { font-size: 12px; font-weight: 800; padding: 3px 7px; border-radius: 6px; letter-spacing: .03em; }
.step.buy .tag { background: var(--go); color: #05281a; }
.step.skip { opacity: .7; } .step.skip .tag { background: var(--line); color: var(--muted); }
.step.pick .tag { background: var(--gold); color: #2a1f05; }
.step b { display: block; }
.step small { color: var(--muted); font-size: 13px; display: block; }
.price { font-family: var(--num); color: var(--gold); font-weight: 700; }

/* Tay bài */
.sec { display: flex; align-items: baseline; gap: 8px; }
.sec h2 { font-size: 16px; font-weight: 700; margin: 0; }
.sec small { color: var(--muted); margin-left: auto; font-size: 13px; }
.hand { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 5px; padding-top: 8px; }
.hand .empty { grid-column: 1 / -1; }
.card { width: 100%; aspect-ratio: 5 / 7; border-radius: 6px; background: var(--paper); color: var(--paper-ink); border: 2px solid transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; font-weight: 800; font-size: 17px; line-height: 1.05; padding: 0; transition: transform .15s; }
.card .s { font-size: 18px; }
.card.red { color: #c8242d; }
.card.sel { border-color: var(--gold); transform: translateY(-4px); }
.card.play { box-shadow: 0 0 0 3px var(--go); transform: translateY(-8px); }
.card.disc { box-shadow: 0 0 0 3px var(--mult); opacity: .75; }
.card .tg { position: absolute; bottom: 2px; left: 1px; right: 1px; font-size: 8px; font-weight: 700; text-transform: uppercase; background: #00000014; border-radius: 2px; }
.card .seal { position: absolute; top: 3px; right: 3px; width: 8px; height: 8px; border-radius: 50%; }
.card.ed-foil { background: linear-gradient(135deg, #e4ecf6, #c9d8ea); } .card.ed-holo { background: linear-gradient(135deg, #fbe1e6, #e7f4ff); } .card.ed-poly { background: linear-gradient(135deg, #ffe5c2, #e2ffd9, #e3dcff); }
.empty { color: var(--muted); border: 1px dashed var(--line); border-radius: 10px; padding: 14px; text-align: center; width: 100%; font-size: 15px; }

/* Bàn phím */
details.pad { background: var(--panel); border-radius: 12px; padding: 10px; }
details.pad summary { font-weight: 600; cursor: pointer; }
.padin { display: grid; gap: 6px; margin-top: 10px; }
.ranks { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.suits { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.k { min-height: 42px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); font-weight: 700; font-size: 17px; }
.k.on { background: var(--gold); color: #2a1f05; border-color: var(--gold); }
.k.suit-H, .k.suit-D { color: #ff8a8f; }
.k.wide { font-size: 13px; font-weight: 600; }
.mods { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
label.f { display: grid; gap: 3px; font-size: 13px; color: var(--muted); }
.sel { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; min-height: 40px; width: 100%; }

/* Joker / mục */
.list { display: grid; gap: 6px; }
.item { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.item .nm { min-width: 0; }
.item .nm b { display: block; font-weight: 700; }
.item .nm small { color: var(--muted); font-size: 13px; }
.item .ctl { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.item input { width: 64px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px; min-height: 36px; }
.ib { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); }
.kind { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.search { width: 100%; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 46px; }
.results { display: grid; gap: 2px; max-height: 280px; overflow-y: auto; }
.results button { text-align: left; background: transparent; border: 0; border-bottom: 1px solid var(--line); padding: 9px 4px; }
.results button small { color: var(--muted); display: block; font-size: 13px; }
.note { color: var(--muted); font-size: 13px; margin: 0; }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--felt); border-radius: 10px; padding: 3px; }
.seg button { border: 0; background: transparent; border-radius: 8px; min-height: 36px; font-weight: 600; color: var(--muted); }
.seg button.on { background: var(--panel-2); color: var(--ink); }

/* Cài đặt */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.levels { display: grid; gap: 4px; }
.levels div { display: grid; grid-template-columns: 1fr auto auto auto; gap: 6px; align-items: center; font-size: 15px; }
.levels b { font-family: var(--num); min-width: 3ch; text-align: center; }
.deckgrid { display: grid; grid-template-columns: repeat(13, 1fr); gap: 2px; }
.deckgrid button { aspect-ratio: 3/4; max-width: 100%; border-radius: 3px; border: 0; background: var(--paper); color: var(--paper-ink); font-weight: 700; font-size: 10px; padding: 0; }
.deckgrid button.red { color: #c8242d; }
.deckgrid button.gone { opacity: .18; }
.deckgrid button.inhand { outline: 2px solid var(--gold); }

/* Tab */
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--panel); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabs button { background: transparent; border: 0; min-height: 50px; color: var(--muted); font-weight: 600; font-size: 15px; border-top: 3px solid transparent; }
.tabs button.on { color: var(--ink); border-top-color: var(--gold); }

/* Màn ngang của điện thoại: bảng thấp (~390px) → gộp trạng thái 1 dòng, thu nhỏ khung */
@media (max-height: 520px) {
  body { font-size: 15px; }
  .status { padding-block: 6px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .row1 { flex: 1 1 100%; }
  .row2 { flex: 1 1 100%; gap: 4px; }
  .ctr b { font-size: 15px; } .ctr span { font-size: 12px; padding-left: 4px; }
  .ctr button { width: 26px; height: 26px; font-size: 16px; }
  .blindbtn { padding: 4px 8px; font-size: 14px; }
  .scroll { padding-block: 8px 12px; gap: 10px; }
  .btn { min-height: 42px; font-size: 15px; }
  .verdict { font-size: 19px; }
  .tabs button { min-height: 40px; font-size: 14px; }
  .result { padding: 10px; gap: 6px; }
}

/* Bảng trượt */
.sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 88%; overflow-y: auto; background: var(--panel); border-top: 2px solid var(--gold); padding: 14px max(14px, env(safe-area-inset-left, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-right, 0px)); display: grid; gap: 10px; z-index: 20; max-width: 600px; margin: 0 auto; box-shadow: 0 -8px 24px #0008; }
.sheet img { height: 110px; image-rendering: pixelated; border-radius: 8px; background: #000; justify-self: start; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(66px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--felt); padding: 10px 16px; border-radius: 10px; font-weight: 600; z-index: 30; max-width: 90%; text-align: center; }
</style>

<div class="app">
  <header class="status">
    <div class="row1">
      <button class="blindbtn" id="blindBtn" aria-label="Sửa ante và blind">Ante 1 · Small</button>
      <div class="prog"><div class="bar"><i id="barFill"></i></div><div class="nums"><span id="scoreNow">0</span> / <span id="targetNum">300</span> · thiếu <span class="need" id="needNum">300</span></div></div>
    </div>
    <div class="row2">
      <div class="ctr h"><span>Đánh</span><button data-ctr="hands" data-d="-1" aria-label="Giảm lượt đánh">−</button><b id="handsN">4</b><button data-ctr="hands" data-d="1" aria-label="Tăng lượt đánh">+</button></div>
      <div class="ctr d"><span>Bỏ</span><button data-ctr="discards" data-d="-1" aria-label="Giảm lượt bỏ">−</button><b id="discardsN">3</b><button data-ctr="discards" data-d="1" aria-label="Tăng lượt bỏ">+</button></div>
      <div class="ctr m"><span>$</span><button data-ctr="money" data-d="-1" aria-label="Giảm tiền">−</button><b id="moneyN">4</b><button data-ctr="money" data-d="1" aria-label="Tăng tiền">+</button></div>
    </div>
  </header>
  <main class="scroll" id="view"></main>
  <nav class="tabs" id="tabs">
    <button data-tab="round" class="on">Vòng</button>
    <button data-tab="shop">Shop</button>
    <button data-tab="jokers">Joker</button>
    <button data-tab="setup">Cài đặt</button>
  </nav>
</div>
<div id="sheetHost"></div>
<div class="toast" id="toast" hidden></div>

<script>
/*__ENGINE__*/
</script>
<script>
(function () {
  const E = window.BalatroEngine;
  const Bridge = window.AndroidBridge || null;
  const $ = (s, r = document) => r.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const ENH = [['', 'Không'], ['bonus', 'Bonus'], ['mult', 'Mult'], ['wild', 'Wild'], ['glass', 'Glass'], ['steel', 'Steel'], ['stone', 'Stone'], ['gold', 'Gold'], ['lucky', 'Lucky']];
  const EDS = [['', 'Không'], ['foil', 'Foil'], ['holo', 'Holo'], ['poly', 'Poly']];
  const JEDS = [['', '—'], ['foil', 'Foil'], ['holo', 'Holo'], ['poly', 'Poly'], ['neg', 'Negative']];
  const SEALS = [['', 'Không'], ['gold', 'Gold'], ['red', 'Red'], ['blue', 'Blue'], ['purple', 'Purple']];
  const SEAL_COLOR = { gold: '#d9a521', red: '#d8323a', blue: '#3a7fd8', purple: '#8a4fd6' };
  const BLIND_VI = ['Small', 'Big', 'Boss'];
  const VOUCHER_FX = { Grabber: { hands: 1 }, 'Nacho Tong': { hands: 1 }, Wasteful: { discards: 1 }, Recyclomancy: { discards: 1 }, 'Paint Brush': { hand: 1 }, Palette: { hand: 1 }, Antimatter: { slots: 1 }, 'Seed Money': { cap: 50 }, 'Money Tree': { cap: 100 }, Hieroglyph: { hands: -1, ante: -1 }, Petroglyph: { discards: -1, ante: -1 } };

  // ---------- Trạng thái ----------
  const KEY = 'balatro-advisor-v2';
  const defaults = () => ({
    tab: 'round', deckType: 'red', stakeIdx: 0, ante: 1, blind: 0, target: 300, targetManual: false, score: 0,
    hands: 4, discards: 3, money: 4, baseHands: 4, baseDiscards: 3, handSize: 8, jokerSlots: 5, interestCap: 25,
    hand: [], seen: [], removed: [], deckMods: {}, extraCards: [], jokers: [], levels: {}, playedTypes: [], handCounts: {},
    boss: {}, bossName: '', oops: false, shopItems: [], reroll: 5, pack: null, addTo: 'shop', skipTag: 'Negative', pickRank: null, selCard: null,
  });
  let S = defaults();
  try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(defaults(), JSON.parse(raw)); } catch (e) {}
  let advice = null, shopAdvice = null, packAdvice = null, skipResult = null;
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

  const deckDef = () => E.DECK_BY_ID[S.deckType] || E.DECKS[0];
  function fullDeck() {
    const base = E.deckCards(S.deckType).filter((c) => !S.removed.includes(c.id));
    const extra = S.extraCards.map((x) => E.makeCard(x.rank, x.suit, x));
    return [...base, ...extra].map((c) => Object.assign(c, S.deckMods[c.id] || {}));
  }
  const handCards = () => S.hand.map((h) => E.makeCard(h.rank, h.suit, h));
  function deckRemaining() {
    const used = new Set([...S.hand.map((h) => h.deckId), ...S.seen]);
    return fullDeck().filter((c) => !used.has(c.id));
  }
  function ctxBase() {
    return {
      jokers: S.jokers, levels: S.levels, money: S.money, jokerSlots: S.jokerSlots, handSize: S.handSize, handCounts: S.handCounts,
      fullDeck: fullDeck(), playedTypes: new Set(S.playedTypes), boss: S.boss, oops: S.oops || S.jokers.some((j) => j.id === 'p_oops_all_6s'),
      stakeIdx: S.stakeIdx, ante: S.ante, hands: S.baseHands, discards: S.baseDiscards, reroll: S.reroll,
      plasma: !!deckDef().plasma, interestCap: deckDef().noInterest ? 0 : S.interestCap,
      nextBossReq: E.blindTarget(S.stakeIdx, S.ante, 2) * (deckDef().plasma ? 2 : 1),
    };
  }
  function targetVal() {
    if (S.targetManual) return S.target;
    const bm = S.boss.wall === 6 ? 6 : S.boss.wall ? 4 : 2;
    return E.blindTarget(S.stakeIdx, S.ante, S.blind, bm) * (deckDef().plasma ? 2 : 1);
  }
  function applyDeck(id) {
    const d = E.DECK_BY_ID[id] || E.DECKS[0];
    S.deckType = d.id; S.removed = []; S.extraCards = []; S.deckMods = {}; S.seen = [];
    S.baseHands = 4 + (d.hands || 0); S.baseDiscards = 3 + (d.discards || 0);
    S.handSize = 8 + (d.hand || 0); S.jokerSlots = 5 + (d.slots || 0);
    S.hands = S.baseHands; S.discards = S.baseDiscards; S.targetManual = false; advice = null;
  }

  // ---------- Lá trên tay ----------
  function takeDeckCard(rank, suit) {
    const used = new Set([...S.hand.map((h) => h.deckId), ...S.seen]);
    const d = fullDeck().find((c) => c.rank === rank && c.suit === suit && !used.has(c.id));
    return d ? { rank, suit, deckId: d.id, id: 'h' + d.id, enh: d.enh, ed: d.ed, seal: d.seal } : { rank, suit, deckId: null, id: 'x' + Math.random().toString(36).slice(2), enh: null, ed: null, seal: null };
  }
  function addCard(rank, suit) {
    if (S.hand.length >= 16) return toast('Tay đã đủ lá');
    S.hand.push(takeDeckCard(rank, suit)); advice = null; save(); render();
  }
  function setMod(field, val) {
    const c = S.hand.find((h) => h.id === S.selCard); if (!c) return;
    c[field] = val || null;
    if (c.deckId) S.deckMods[c.deckId] = { ...(S.deckMods[c.deckId] || {}), [field]: val || null };
    advice = null; save(); render();
  }

  // ---------- Gợi ý lượt chơi ----------
  function runAdvice() {
    if (!S.hand.length) return toast('Chưa có lá trên tay — bấm Quét hoặc nhập tay');
    const box = $('#adviceBox'); if (box) box.innerHTML = '<div class="result"><p class="why">Đang tính…</p></div>';
    setTimeout(() => {
      const ctx = ctxBase(); const hand = handCards();
      const a = E.advise({ ...ctx, hand, deckRemaining: deckRemaining(), need: targetVal() - S.score, handsLeft: S.hands, discardsLeft: S.discards }, { samples: 90 });
      a.jokerOrder = E.bestJokerOrder({ ...ctx, hand }, { samples: 12 });
      advice = a; render(); pushHighlight();
    }, 30);
  }
  function applyAdvice() {
    const a = advice; if (!a) return;
    if (a.action === 'play') {
      const ids = new Set(a.play.cards);
      S.hand.filter((h) => ids.has(h.id)).forEach((h) => h.deckId && S.seen.push(h.deckId));
      S.hand = S.hand.filter((h) => !ids.has(h.id));
      S.score += a.play.score; S.hands = Math.max(0, S.hands - 1); S.money += Math.round(a.play.money || 0);
      if (!S.playedTypes.includes(a.play.type)) S.playedTypes.push(a.play.type);
      S.handCounts[a.play.type] = (S.handCounts[a.play.type] || 0) + 1;
      toast(S.score >= targetVal() ? 'Qua blind! Sang shop rồi bấm Quét.' : `+${E.fmt(a.play.score)} điểm — bấm Quét để đọc lá mới`);
    } else if (a.action === 'discard') {
      const ids = new Set(a.discard.discard);
      S.hand.filter((h) => ids.has(h.id)).forEach((h) => h.deckId && S.seen.push(h.deckId));
      S.hand = S.hand.filter((h) => !ids.has(h.id));
      S.discards = Math.max(0, S.discards - 1);
      toast('Đã bỏ — bấm Quét để đọc lá mới');
    }
    advice = null; save(); render(); clearHL();
  }
  function newRound(next) {
    if (next) { if (S.blind < 2) S.blind++; else { S.blind = 0; S.ante++; } }
    S.score = 0; S.hands = S.baseHands; S.discards = S.baseDiscards; S.hand = []; S.seen = []; S.playedTypes = []; S.targetManual = false;
    S.boss = {}; S.bossName = ''; advice = null; save(); render(); clearHL();
  }

  // ---------- Shop / pack ----------
  function addItem(it, where) {
    const dest = where || (S.pack ? 'pack' : 'shop');
    const obj = { kind: it.kind, name: it.name, id: it.id || (it.kind === 'joker' ? E.jokerIdByName(it.name) : undefined), price: it.price ?? defaultPrice(it), ed: it.ed || null, hand: it.hand, type: it.type, size: it.size, rank: it.rank, suit: it.suit, enh: it.enh || null, seal: it.seal || null };
    if (dest === 'pack') {
      if (!S.pack) S.pack = { type: it.kind === 'card' ? 'standard' : 'buffoon', choose: 1, options: [] };
      if (!S.pack.options.some((o) => o.name === obj.name && o.enh === obj.enh && o.ed === obj.ed)) S.pack.options.push(obj);
      packAdvice = null;
    } else {
      const ex = S.shopItems.find((o) => o.name === obj.name && o.kind === obj.kind);
      if (ex) { if (it.price != null) ex.price = it.price; if (it.ed) ex.ed = it.ed; }
      else S.shopItems.push(obj);
      shopAdvice = null;
    }
    save();
  }
  function defaultPrice(it) {
    if (it.kind === 'joker') { const d = E.JOKER_BY_ID[it.id || E.jokerIdByName(it.name)]; return [0, 5, 6, 8, 20][d?.r || 1] || 5; }
    if (it.kind === 'voucher') return 10;
    if (it.kind === 'pack') return it.size === 'mega' ? 8 : it.size === 'jumbo' ? 6 : 4;
    if (it.kind === 'spectral') return 4;
    return 3;
  }
  function runShop() {
    if (!S.shopItems.length) return toast('Chưa có món nào — chạm từng món trong game rồi bấm Quét');
    $('#shopOut') && ($('#shopOut').innerHTML = '<div class="result"><p class="why">Đang mô phỏng…</p></div>');
    setTimeout(() => { shopAdvice = E.adviseShopFull({ ...ctxBase(), hand: handCards() }, S.shopItems, { samples: 36, reroll: S.reroll }); render(); }, 30);
  }
  function runPack() {
    if (!S.pack || !S.pack.options.length) return toast('Chạm từng lá trong pack rồi bấm Quét để app đọc tên');
    $('#packOut') && ($('#packOut').innerHTML = '<div class="result"><p class="why">Đang tính…</p></div>');
    setTimeout(() => {
      packAdvice = E.advisePack({ ...ctxBase(), hand: handCards() }, S.pack.type, S.pack.options, { samples: 36, choose: S.pack.choose || 1 });
      render();
      const p = packAdvice.picks[0];
      if (p && p.targets && p.targets.length && Bridge && Bridge.highlight) {
        const marks = p.targets.map((id) => scanBoxes[id] && { box: scanBoxes[id], color: '#f0bd45' }).filter(Boolean);
        if (marks.length) Bridge.highlight(JSON.stringify({ marks, label: `Dùng ${p.name} lên ${marks.length} lá này` }));
      }
    }, 30);
  }
  // Người chơi bấm "Đã mua"/"Đã chọn": cập nhật trạng thái theo món
  function acquire(it, paid) {
    if (paid) S.money = Math.max(0, S.money - (it.price || 0));
    if (it.kind === 'joker') S.jokers.push({ id: it.id || E.jokerIdByName(it.name) || 'passive', ed: it.ed || null });
    else if (it.kind === 'planet') { const h = it.hand || E.PLANETS.find((p) => p.name === it.name)?.hand; if (h) S.levels[h] = (S.levels[h] || 1) + 1; }
    else if (it.kind === 'voucher') {
      const fx = VOUCHER_FX[it.name] || {};
      if (fx.hands) { S.baseHands += fx.hands; S.hands += fx.hands; }
      if (fx.discards) { S.baseDiscards += fx.discards; S.discards += fx.discards; }
      if (fx.hand) S.handSize += fx.hand;
      if (fx.slots) S.jokerSlots += fx.slots;
      if (fx.cap) S.interestCap = fx.cap;
      if (fx.ante) S.ante = Math.max(1, S.ante + fx.ante);
    } else if (it.kind === 'pack') {
      S.pack = { type: it.type || 'buffoon', choose: it.size === 'mega' ? 2 : 1, options: [] }; S.addTo = 'pack'; packAdvice = null;
      toast('Mở pack trong game, chạm từng lá rồi bấm Quét');
    } else if (it.kind === 'card') {
      S.extraCards.push({ rank: it.rank, suit: it.suit, enh: it.enh, seal: it.seal, ed: it.ed, id: 'x' + Date.now() });
    } else if (it.kind === 'tarot') {
      const t = E.TAROTS.find((x) => x.name === it.name);
      const targets = (it.targets || []).map((id) => S.hand.find((h) => h.id === id)).filter(Boolean);
      if (t?.act && targets.length) {
        targets.forEach((h) => {
          const mod = t.act.kind === 'enh' ? { enh: t.act.enh } : t.act.kind === 'suit' ? { suit: t.act.suit } : null;
          if (mod) { Object.assign(h, mod); if (h.deckId) S.deckMods[h.deckId] = { ...(S.deckMods[h.deckId] || {}), ...mod }; }
          if (t.act.kind === 'destroy' && h.deckId) { S.removed.push(h.deckId); S.hand = S.hand.filter((x) => x !== h); }
        });
      }
      if (t?.money === 'hermit') S.money += Math.min(20, S.money);
    } else if (it.kind === 'spectral' && it.name === 'Black Hole') {
      E.HAND_TYPES.forEach(([n]) => (S.levels[n] = (S.levels[n] || 1) + 1));
    }
    if (paid) S.shopItems = S.shopItems.filter((x) => x !== it && !(x.name === it.name && x.kind === it.kind));
    shopAdvice = null; save(); render();
  }

  // ---------- Cầu nối Android ----------
  let scanBoxes = {};
  function clearHL() { Bridge && Bridge.clearHighlight && Bridge.clearHighlight(); }
  function pushHighlight() {
    if (!Bridge || !Bridge.highlight || !advice) return;
    const a = advice;
    const ids = a.action === 'play' ? a.play.cards : a.action === 'discard' ? a.discard.discard : [];
    const marks = ids.map((id) => scanBoxes[id] && { box: scanBoxes[id], color: a.action === 'play' ? '#4fd096' : '#ef5056' }).filter(Boolean);
    const label = a.action === 'play' ? `ĐÁNH ${ids.length} lá · ${a.play.type} · ${E.fmt(a.play.score)}` : `BỎ ${ids.length} lá`;
    Bridge.highlight(JSON.stringify({ marks, label }));
  }
  window.__onScan = function (json) {
    let r; try { r = JSON.parse(json); } catch (e) { return toast('Không đọc được kết quả quét'); }
    const scr = E.parseScreen(r.lines || [], r.w || 2376, r.h || 1080);
    if (scr.money != null) S.money = scr.money;
    if (scr.ante) S.ante = scr.ante;
    if (scr.screen === 'round' || (scr.screen === 'unknown' && (r.cards || []).length >= 3 && !(r.lines || []).length)) {
      if (scr.blind != null) S.blind = scr.blind;
      if (scr.target) { S.target = scr.target; S.targetManual = true; }
      if (scr.boss) { S.bossName = scr.boss; S.boss = { ...(E.BOSSES[scr.boss] || {}) }; }
      S.pack = null; S.tab = 'round';
      loadCards(r.cards || [], true);
      return;
    }
    if (scr.screen === 'shop') {
      S.tab = 'shop'; S.pack = null; S.addTo = 'shop'; if (scr.reroll) S.reroll = scr.reroll;
      if (scr.tooltip) { addItem(scr.tooltip, 'shop'); toast(`Đã thêm ${scr.tooltip.name}${scr.tooltip.price != null ? ` ($${scr.tooltip.price})` : ''}`); }
      else toast('Đang ở shop. Chạm một món trong game để hiện mô tả rồi bấm Quét.');
      save(); render(); return;
    }
    if (scr.screen === 'pack') {
      S.tab = 'shop'; S.addTo = 'pack';
      if (!S.pack || (scr.packType && S.pack.type !== scr.packType)) S.pack = { type: scr.packType || 'buffoon', choose: scr.choose || 1, options: [] };
      if (scr.choose) S.pack.choose = scr.choose;
      if (scr.tooltip) { addItem(scr.tooltip, 'pack'); toast(`Đã thêm vào pack: ${scr.tooltip.name}`); }
      else toast('Chạm từng lá trong pack để hiện mô tả rồi bấm Quét.');
      if (['arcana', 'spectral'].includes(S.pack.type) && (r.cards || []).length >= 3) loadCards(r.cards, false);
      packAdvice = null; save(); render(); return;
    }
    if (scr.screen === 'blind') { S.tab = 'shop'; save(); render(); return toast('Màn chọn blind: xem mục "Có nên skip?" bên dưới'); }
    toast('Chưa nhận ra màn hình. Hãy quét khi đang chơi, ở shop hoặc đang mở pack.');
  };
  function loadCards(cards, autoAdvise) {
    if (!cards.length) { save(); render(); return toast('Không thấy lá nào trên tay'); }
    S.hand = []; scanBoxes = {}; advice = null;
    const unknown = [];
    cards.forEach((c) => {
      if (c.rank && c.suit) { const h = takeDeckCard(c.rank, c.suit); S.hand.push(h); scanBoxes[h.id] = c.box; }
      else unknown.push(c);

    save(); render();
    if (unknown.length) labelQueue(unknown, autoAdvise);
    else if (autoAdvise) runAdvice();
  }
  // Dạy app nhận lá chưa chắc: chọn số + chất một lần

    if (!list.length) {
      host.innerHTML = '';
      S.hand.sort((a, b) => ((scanBoxes[a.id] || [1e9])[0]) - ((scanBoxes[b.id] || [1e9])[0]));
      save(); render(); if (autoAdvise) runAdvice(); return;
    }

    host.innerHTML = `<div class="sheet" role="dialog" aria-label="Dạy nhận lá">

      <div class="suits">${E.SUITS.map((s) => `<button class="k suit-${s}" data-ls="${s}" aria-label="Chất ${s}">${E.SUIT_SYM[s]}</button>`).join('')}</div>
      <button class="btn ghost" id="lblSkip">Bỏ qua lá này</button></div>`;
    host.querySelectorAll('[data-lr]').forEach((b) => (b.onclick = () => { rk = +b.dataset.lr; host.querySelectorAll('[data-lr]').forEach((x) => x.classList.toggle('on', x === b)); }));
    host.querySelectorAll('[data-ls]').forEach((b) => (b.onclick = () => {
      if (!rk) return toast('Chọn số trước');

      const h = takeDeckCard(rk, b.dataset.ls); S.hand.push(h); scanBoxes[h.id] = c.box;

  function doScan() { if (Bridge && Bridge.scan) Bridge.scan(S.handSize || 8); }

  // ---------- Hiển thị ----------

  function viewRound() {

      ${sel ? `<div class="mods">

  function viewShop() {

      ${S.pack ? `<div class="sec"><h2>Đang mở: ${esc(E.PACKS.find((p) => p.type === S.pack.type)?.name || 'Pack')}</h2><small>chọn ${S.pack.choose}</small></div>
        <div id="packOut">${packRes}</div>
        <div class="list">${S.pack.options.length ? S.pack.options.map((o, i) => itemRow(o, i, 'pack')).join('') : '<div class="empty">Trong game, chạm từng lá trong pack để hiện mô tả, rồi bấm Quét.</div>'}</div>
        <div class="row"><button class="btn small ghost" id="closePack">Đóng pack (về shop)</button></div>` : ''}
      ${!S.pack ? `<div id="shopOut">${shopRes}</div>` : ''}
      <div class="sec"><h2>Món trong shop</h2><small>$${S.money} · lãi tối đa $${cap}</small></div>
      <div class="list">${S.shopItems.length ? S.shopItems.map((o, i) => itemRow(o, i, 'shop')).join('') : '<div class="empty">Trong game, chạm một món để hiện mô tả rồi bấm Quét — app đọc tên và giá. Hoặc tìm và thêm bên dưới.</div>'}</div>
      <div class="row"><label class="note">Giá reroll $<input class="sel" style="width:70px;display:inline-block" type="number" inputmode="numeric" id="rerollIn" value="${S.reroll}"></label><button class="btn small ghost" id="clearShop">Xóa danh sách shop</button></div>
      <div class="seg" role="tablist" aria-label="Thêm vào"><button class="${S.addTo === 'shop' ? 'on' : ''}" data-addto="shop">Thêm vào shop</button><button class="${S.addTo === 'pack' ? 'on' : ''}" data-addto="pack">Thêm vào pack</button></div>
      <input class="search" id="sq" placeholder="Tìm: joker, tarot, planet, voucher, pack…" value="${esc(sq)}" autocomplete="off">
      <div class="results" id="sres">${searchResults(sq)}</div>
      <div class="sec"><h2>Có nên skip blind?</h2></div>
      <div class="row"><select class="sel" style="width:auto;flex:1" id="tagSel">${Object.keys(E.GOOD_TAGS).map((t) => `<option ${t === S.skipTag ? 'selected' : ''}>${t}</option>`).join('')}</select>
        <button class="btn small" id="rateSkip">Đánh giá skip ${BLIND_VI[S.blind]}</button></div>
      <div id="skipOut">${skipResult || ''}</div>`;
  }

  let jq = '';
  function viewJokers() {
    const jres = jq.trim() ? E.JOKERS.filter((j) => j.name.toLowerCase().includes(jq.toLowerCase()) || j.vi.toLowerCase().includes(jq.toLowerCase())).slice(0, 30)
      .map((j) => `<button data-jadd="${j.id}"><b>${esc(j.name)}</b><small>${esc(j.vi)}</small></button>`).join('') : '';
    return `
      <div class="sec"><h2>Joker đang có</h2><small>${S.jokers.length}/${S.jokerSlots} ô · thứ tự trái → phải</small></div>
      <div class="list">${S.jokers.length ? S.jokers.map((j, i) => {
        const d = E.JOKER_BY_ID[j.id] || { name: j.id, vi: '' };
        const val = d.value === 'custom' ? `<input data-jf="chips" data-ji="${i}" type="number" placeholder="+chip" value="${j.chips ?? ''}"><input data-jf="mult" data-ji="${i}" type="number" placeholder="+mult" value="${j.mult ?? ''}"><input data-jf="x" data-ji="${i}" type="number" step="0.1" placeholder="×" value="${j.x ?? ''}">`
          : d.value === 'chat' ? `<select class="sel" style="width:auto" data-jf="suit" data-ji="${i}">${opts(E.SUITS.map((s) => [s, E.SUIT_SYM[s]]), j.suit || 'H')}</select>`
          : d.value === 'la' ? `<select class="sel" style="width:auto" data-jf="rank" data-ji="${i}">${opts(E.RANKS.map((r) => [String(r), E.RANK_LABEL[r]]), String(j.rank || 14))}</select><select class="sel" style="width:auto" data-jf="suit" data-ji="${i}">${opts(E.SUITS.map((s) => [s, E.SUIT_SYM[s]]), j.suit || 'S')}</select>`
          : d.value === 'kichHoat' ? `<label class="note"><input type="checkbox" data-jf="v" data-ji="${i}" ${j.v ? 'checked' : ''}> đang ×4</label>`
          : d.value ? `<input data-jf="v" data-ji="${i}" type="number" step="0.1" placeholder="${d.value === 'x' ? '×' : '+'}" value="${j.v ?? ''}" aria-label="Giá trị hiện tại">` : '';
        return `<div class="item"><div class="nm"><b>${i + 1}. ${esc(d.name)}</b><small>${esc(d.vi)}</small></div><div class="ctl">${val}
          <select class="sel" style="width:auto" data-jf="ed" data-ji="${i}" aria-label="Edition">${opts(JEDS, j.ed)}</select>
          <button class="ib" data-jmove="${i}" data-d="-1" aria-label="Sang trái">↑</button><button class="ib" data-jmove="${i}" data-d="1" aria-label="Sang phải">↓</button><button class="ib" data-jdel="${i}" aria-label="Bán / xóa">✕</button></div></div>`;
      }).join('') : '<div class="empty">Chưa có joker. Tìm và thêm bên dưới.</div>'}</div>
      <button class="btn" id="optOrder">Xếp thứ tự tối ưu</button>
      <input class="search" id="jq" placeholder="Tìm joker theo tên hoặc hiệu ứng…" value="${esc(jq)}" autocomplete="off">
      <div class="results" id="jres">${jres}</div>
      <p class="note">Joker tích lũy (Ride the Bus, Hologram…) nhập giá trị hiện tại vào ô số. Joker chưa có trong danh sách: chọn "Joker khác (tự nhập)".</p>`;
  }

  function viewSetup() {
    const deck = fullDeck(); const ids = new Set(deck.map((c) => c.id)); const inHand = new Set(S.hand.map((h) => h.deckId));
    return `
      <div class="sec"><h2>Ván chơi</h2></div>
      <label class="f">Deck<select class="sel" id="deckSel">${E.DECKS.map((d) => `<option value="${d.id}" ${d.id === S.deckType ? 'selected' : ''}>${d.name} — ${d.vi}</option>`).join('')}</select></label>
      <div class="grid2">
        <label class="f">Stake<select class="sel" id="stake">${E.STAKES.map((s, i) => `<option value="${i}" ${i === S.stakeIdx ? 'selected' : ''}>${s}</option>`).join('')}</select></label>
        <label class="f">Số lá trên tay<input class="sel" id="hsize" type="number" value="${S.handSize}"></label>
        <label class="f">Lượt đánh mỗi vòng<input class="sel" id="bh" type="number" value="${S.baseHands}"></label>
        <label class="f">Lượt bỏ mỗi vòng<input class="sel" id="bd" type="number" value="${S.baseDiscards}"></label>
        <label class="f">Ô joker<input class="sel" id="slots" type="number" value="${S.jokerSlots}"></label>
        <label class="f">Trần lãi ($)<input class="sel" id="capIn" type="number" value="${S.interestCap}"></label>
      </div>
      <div class="sec"><h2>Level tay bài</h2><small>tăng khi dùng planet</small></div>
      <div class="levels">${E.HAND_TYPES.map(([n]) => { const l = S.levels[n] || 1; const hi = E.HAND_INFO[n];
        return `<div><span>${n} <span class="note">${hi.chips + hi.dc * (l - 1)}×${hi.mult + hi.dm * (l - 1)}</span></span><button class="ib" data-lv="${n}" data-d="-1" aria-label="Giảm level">−</button><b>${l}</b><button class="ib" data-lv="${n}" data-d="1" aria-label="Tăng level">+</button></div>`; }).join('')}</div>
      <div class="sec"><h2>Bộ bài</h2><small>${deck.length} lá · chạm để đánh dấu lá đã bị hủy</small></div>
      <div style="overflow-x:auto"><div class="deckgrid">${E.deckCards(S.deckType).map((c) => `<button class="${isRed(c.suit) ? 'red' : ''} ${ids.has(c.id) ? '' : 'gone'} ${inHand.has(c.id) ? 'inhand' : ''}" data-deck="${c.id}" aria-label="${c.id}">${E.RANK_LABEL[c.rank]}${E.SUIT_SYM[c.suit]}</button>`).join('')}</div></div>
      <div class="row"><select class="sel" style="width:auto" id="xr">${E.RANKS.map((r) => `<option value="${r}">${E.RANK_LABEL[r]}</option>`).join('')}</select><select class="sel" style="width:auto" id="xs">${E.SUITS.map((s) => `<option value="${s}">${E.SUIT_SYM[s]}</option>`).join('')}</select>
        <button class="btn small" id="addExtra">+ Lá thêm vào bộ</button></div>
      ${S.extraCards.length ? `<p class="note">Lá thêm: ${S.extraCards.map((x, i) => `${E.RANK_LABEL[x.rank]}${E.SUIT_SYM[x.suit]}${x.enh ? ' ' + x.enh : ''} <button class="ib" data-xdel="${i}" aria-label="Xóa">✕</button>`).join(' ')}</p>` : ''}
      <div class="sec"><h2>Bắt đầu lại</h2></div>
      <button class="btn danger" id="newRun">Ván mới (giữ deck đang chọn)</button>
      <p class="note">Hiệu ứng may rủi (Lucky, Misprint, Bloodstone) được tính theo kỳ vọng. Dữ liệu lưu trên máy này.</p>`;
  }

  function openBlindSheet() {
    const host = $('#sheetHost');
    host.innerHTML = `<div class="sheet" role="dialog" aria-label="Sửa blind">
      <div class="sec"><h2>Blind hiện tại</h2><small>Quét màn chơi sẽ tự điền</small></div>
      <div class="grid2">
        <label class="f">Ante<select class="sel" id="anteSel">${Array.from({ length: 16 }, (_, i) => `<option value="${i + 1}" ${S.ante === i + 1 ? 'selected' : ''}>Ante ${i + 1}</option>`).join('')}</select></label>
        <label class="f">Blind<select class="sel" id="blindSel">${opts([[0, 'Small'], [1, 'Big'], [2, 'Boss']], S.blind)}</select></label>
        <label class="f">Điểm cần<input class="sel" id="targetIn" type="number" inputmode="numeric" value="${targetVal()}"></label>
        <label class="f">Điểm đã có<input class="sel" id="scoreIn" type="number" inputmode="numeric" value="${S.score}"></label>
      </div>
      <button class="btn primary" id="sheetDone">Xong</button></div>`;
    $('#anteSel').onchange = (e) => { S.ante = +e.target.value; S.targetManual = false; $('#targetIn').value = targetVal(); save(); renderHeader(); };
    $('#blindSel').onchange = (e) => { S.blind = +e.target.value; S.targetManual = false; $('#targetIn').value = targetVal(); save(); renderHeader(); };
    $('#targetIn').onchange = (e) => { S.target = +e.target.value || 0; S.targetManual = true; save(); renderHeader(); };
    $('#scoreIn').onchange = (e) => { S.score = +e.target.value || 0; save(); renderHeader(); };
    $('#sheetDone').onclick = () => { host.innerHTML = ''; advice = null; render(); };
  }

  function renderHeader() {
    const t = targetVal();
    $('#blindBtn').textContent = `Ante ${S.ante} · ${S.blind === 2 && S.bossName ? S.bossName : BLIND_VI[S.blind]}`;
    $('#scoreNow').textContent = E.fmt(S.score); $('#targetNum').textContent = E.fmt(t);
    $('#needNum').textContent = E.fmt(Math.max(0, t - S.score));
    $('#barFill').style.width = Math.min(100, (S.score / Math.max(1, t)) * 100) + '%';
    $('#handsN').textContent = S.hands; $('#discardsN').textContent = S.discards; $('#moneyN').textContent = S.money;
    document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.tab === S.tab));
  }
  function render() {
    renderHeader();
    const v = $('#view');
    v.innerHTML = S.tab === 'round' ? viewRound() : S.tab === 'shop' ? viewShop() : S.tab === 'jokers' ? viewJokers() : viewSetup();
    bind();
  }
  function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => (t.hidden = true), 2600); }

  // ---------- Sự kiện ----------
  function bind() {
    const v = $('#view');
    const on = (sel, ev, fn) => { const el = v.querySelector(sel); if (el) el[ev] = fn; };
    on('#scan', 'onclick', doScan);
    // Vòng
    on('#ask', 'onclick', runAdvice);
    on('#doIt', 'onclick', applyAdvice);
    on('#applyOrder', 'onclick', () => { S.jokers = advice.jokerOrder.order; save(); runAdvice(); });
    v.querySelectorAll('[data-rank]').forEach((b) => (b.onclick = () => { S.pickRank = +b.dataset.rank; render(); $('details.pad') && ($('details.pad').open = true); }));
    v.querySelectorAll('[data-suit]').forEach((b) => (b.onclick = () => { if (!S.pickRank) return toast('Chạm số trước'); addCard(S.pickRank, b.dataset.suit); $('details.pad') && ($('details.pad').open = true); }));
    v.querySelectorAll('[data-card]').forEach((b) => (b.onclick = () => { S.selCard = S.selCard === b.dataset.card ? null : b.dataset.card; render(); }));
    on('#mEnh', 'onchange', (e) => setMod('enh', e.target.value));
    on('#mEd', 'onchange', (e) => setMod('ed', e.target.value));
    on('#mSeal', 'onchange', (e) => setMod('seal', e.target.value));
    on('#rmCard', 'onclick', () => { S.hand = S.hand.filter((h) => h.id !== S.selCard); S.selCard = null; advice = null; save(); render(); });
    on('#deselect', 'onclick', () => { S.selCard = null; render(); });
    on('#clearHand', 'onclick', () => { S.hand = []; advice = null; save(); render(); });
    on('#nextBlind', 'onclick', () => { newRound(true); S.tab = 'shop'; S.shopItems = []; shopAdvice = null; save(); render(); });
    on('#resetRound', 'onclick', () => newRound(false));
    const boss = (id, k) => on(id, 'onchange', (e) => { S.boss[k] = e.target.type === 'checkbox' ? e.target.checked : e.target.value; advice = null; save(); render(); });
    boss('#bFlint', 'flint'); boss('#bPsy', 'psychic'); boss('#bFace', 'debuffFace'); boss('#bSuit', 'debuffSuit');
    // Shop / pack
    on('#rateShop', 'onclick', runShop);
    on('#ratePack', 'onclick', runPack);
    on('#closePack', 'onclick', () => { S.pack = null; S.addTo = 'shop'; packAdvice = null; clearHL(); save(); render(); });
    on('#clearShop', 'onclick', () => { S.shopItems = []; shopAdvice = null; save(); render(); });
    on('#rerollIn', 'onchange', (e) => { S.reroll = +e.target.value || 5; save(); });
    v.querySelectorAll('[data-addto]').forEach((b) => (b.onclick = () => { S.addTo = b.dataset.addto; save(); render(); }));
    const bindCat = () => v.querySelectorAll('[data-cat]').forEach((b) => (b.onclick = () => {
      const it = E.CATALOG[+b.dataset.cat];
      if (S.addTo === 'pack') { if (!S.pack) S.pack = { type: it.kind === 'tarot' ? 'arcana' : it.kind === 'planet' ? 'celestial' : it.kind === 'spectral' ? 'spectral' : 'buffoon', choose: 1, options: [] }; addItem(it, 'pack'); }
      else addItem(it, 'shop');
      sq = ''; render(); toast(`Đã thêm ${it.name}`);
    }));
    on('#sq', 'oninput', (e) => { sq = e.target.value; $('#sres').innerHTML = searchResults(sq); bindCat(); });
    bindCat();
    v.querySelectorAll('[data-iprice]').forEach((el) => (el.onchange = () => { S.shopItems[+el.dataset.iprice].price = +el.value; shopAdvice = null; save(); }));
    v.querySelectorAll('[data-ied]').forEach((el) => (el.onchange = () => { const [w, i] = el.dataset.ied.split(':'); (w === 'pack' ? S.pack.options : S.shopItems)[+i].ed = el.value || null; save(); }));
    v.querySelectorAll('[data-idel]').forEach((b) => (b.onclick = () => { const [w, i] = b.dataset.idel.split(':'); (w === 'pack' ? S.pack.options : S.shopItems).splice(+i, 1); shopAdvice = null; packAdvice = null; save(); render(); }));
    v.querySelectorAll('[data-bought]').forEach((b) => (b.onclick = () => { const p = shopAdvice.plan[+b.dataset.bought]; acquire(S.shopItems.find((x) => x.name === p.name && x.kind === p.kind) || p, true); toast(`Đã mua ${p.name}`); }));
    v.querySelectorAll('[data-picked]').forEach((b) => (b.onclick = () => {
      const p = packAdvice.rated[+b.dataset.picked]; acquire(p, false);
      S.pack.choose = Math.max(0, (S.pack.choose || 1) - 1); S.pack.options = S.pack.options.filter((o) => !(o.name === p.name && o.enh === p.enh));
      if (S.pack.choose <= 0) { S.pack = null; toast(`Đã chọn ${p.name} — đóng pack`); } else toast(`Đã chọn ${p.name}`);
      packAdvice = null; clearHL(); save(); render();
    }));
    on('#tagSel', 'onchange', (e) => { S.skipTag = e.target.value; save(); });
    on('#rateSkip', 'onclick', () => {
      if (S.blind === 2) { skipResult = '<p class="why">Boss Blind không skip được.</p>'; return render(); }
      const r = E.adviseSkip({ ...ctxBase() }, S.blind, S.skipTag);
      skipResult = `<div class="result ${r.skip ? 'play' : 'discard'}"><div class="verdict">${r.skip ? 'NÊN SKIP' : 'KHÔNG SKIP'}</div>
        <p class="why">Ước tính cả vòng ~${E.fmt(r.roundCap)} điểm; blind sau cần ${E.fmt(r.nextReq)}, boss cần ${E.fmt(r.bossReq)}. Tag ${esc(S.skipTag)}: ${r.tagValue}/5.</p></div>`;
      render();
    });
    // Joker
    on('#jq', 'oninput', (e) => { jq = e.target.value; render(); const el = $('#jq'); el.focus(); el.setSelectionRange(jq.length, jq.length); });
    v.querySelectorAll('[data-jadd]').forEach((b) => (b.onclick = () => { S.jokers.push({ id: b.dataset.jadd }); jq = ''; save(); render(); }));
    v.querySelectorAll('[data-jf]').forEach((el) => (el.onchange = () => { const j = S.jokers[+el.dataset.ji]; const f = el.dataset.jf; j[f] = el.type === 'checkbox' ? el.checked : el.type === 'number' ? (el.value === '' ? undefined : +el.value) : f === 'rank' ? +el.value : (el.value || null); advice = null; save(); }));
    v.querySelectorAll('[data-jmove]').forEach((b) => (b.onclick = () => { const i = +b.dataset.jmove, k = i + +b.dataset.d; if (k < 0 || k >= S.jokers.length) return; [S.jokers[i], S.jokers[k]] = [S.jokers[k], S.jokers[i]]; save(); render(); }));
    v.querySelectorAll('[data-jdel]').forEach((b) => (b.onclick = () => { S.jokers.splice(+b.dataset.jdel, 1); save(); render(); }));
    on('#optOrder', 'onclick', () => { const r = E.bestJokerOrder({ ...ctxBase(), hand: handCards() }, { samples: 25 }); if (!r.changed) return toast('Thứ tự hiện tại đã tối ưu'); S.jokers = r.order; save(); render(); toast('Đã xếp lại thứ tự joker'); });
    // Cài đặt
    on('#deckSel', 'onchange', (e) => { applyDeck(e.target.value); save(); render(); toast('Đã đổi deck'); });
    on('#stake', 'onchange', (e) => { S.stakeIdx = +e.target.value; S.targetManual = false; save(); render(); });
    const num = (id, k, after) => on(id, 'onchange', (e) => { S[k] = Math.max(0, +e.target.value || 0); after && after(); save(); render(); });
    num('#hsize', 'handSize'); num('#slots', 'jokerSlots'); num('#capIn', 'interestCap');
    num('#bh', 'baseHands', () => (S.hands = S.baseHands)); num('#bd', 'baseDiscards', () => (S.discards = S.baseDiscards));
    v.querySelectorAll('[data-lv]').forEach((b) => (b.onclick = () => { const n = b.dataset.lv; S.levels[n] = Math.max(1, (S.levels[n] || 1) + +b.dataset.d); advice = null; save(); render(); }));
    v.querySelectorAll('[data-deck]').forEach((b) => (b.onclick = () => { const id = b.dataset.deck; S.removed = S.removed.includes(id) ? S.removed.filter((x) => x !== id) : [...S.removed, id]; save(); render(); }));
    on('#addExtra', 'onclick', () => { S.extraCards.push({ rank: +$('#xr').value, suit: $('#xs').value, id: 'x' + Date.now() }); save(); render(); });
    v.querySelectorAll('[data-xdel]').forEach((b) => (b.onclick = () => { S.extraCards.splice(+b.dataset.xdel, 1); save(); render(); }));
    let armed = false;
    on('#newRun', 'onclick', (e) => { if (!armed) { armed = true; e.target.textContent = 'Chạm lần nữa để xóa ván'; return; } const keep = S.deckType; S = defaults(); applyDeck(keep); S.money = 4 + (E.DECK_BY_ID[keep]?.money || 0); save(); render(); toast('Đã tạo ván mới'); });
  }

  $('#blindBtn').onclick = openBlindSheet;
  document.querySelectorAll('[data-ctr]').forEach((b) => (b.onclick = () => { const k = b.dataset.ctr; S[k] = Math.max(0, S[k] + +b.dataset.d); advice = null; save(); renderHeader(); }));
  $('#tabs').onclick = (e) => { const b = e.target.closest('button'); if (!b) return; S.tab = b.dataset.tab; save(); render(); };

  // Trong cửa sổ nổi Android, hộp chọn gốc của WebView bị crash → thay bằng bảng chọn tự vẽ.
  if (Bridge) {
    const openPicker = (sel) => {
      const host = $('#sheetHost');
      host.innerHTML = `<div class="sheet" role="dialog" aria-label="Chọn"><div class="results" style="max-height:none">${[...sel.options].map((o, i) =>
        `<button data-pick="${i}" ${o.selected ? 'style="color:var(--gold)"' : ''}>${esc(o.text)}</button>`).join('')}</div>
        <button class="btn ghost" id="pickClose">Đóng</button></div>`;
      host.querySelectorAll('[data-pick]').forEach((b) => (b.onclick = () => { sel.selectedIndex = +b.dataset.pick; host.innerHTML = ''; sel.dispatchEvent(new Event('change', { bubbles: true })); }));
      $('#pickClose').onclick = () => (host.innerHTML = '');
    };
    const block = (e) => { const s = e.target.closest && e.target.closest('select'); if (!s) return; e.preventDefault(); e.stopPropagation(); if (e.type === 'click' || e.type === 'touchend') openPicker(s); };
    ['touchstart', 'touchend', 'mousedown', 'click'].forEach((t) => document.addEventListener(t, block, { capture: true, passive: false }));
  }

  // Lần đầu mở trên web: ví dụ để thấy tool hoạt động
  if (!Bridge && !S.hand.length && !S.jokers.length && !S.example) {
    S.example = true;
    [[14, 'S'], [13, 'S'], [7, 'S'], [4, 'S'], [9, 'H'], [9, 'D'], [3, 'C'], [11, 'D']].forEach(([r, s]) => S.hand.push(takeDeckCard(r, s)));
    S.jokers = [{ id: 'joker' }, { id: 'droll' }];
    save(); setTimeout(() => toast('Tay bài mẫu — xóa và nhập tay của bạn'), 400);
  }
  render();
  window.__advisor = { state: () => S, render };
  window.__toast = toast;
})();
</script>
