<title>Balatro Advisor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Bố cục: app một màn hình như mặt bàn nỉ; trên = thanh tiến độ blind, giữa = tay bài + gợi ý, dưới = thanh tab */
:root {
  --felt: #0d2622;      /* nền bàn */
  --panel: #143630;     /* khối nổi */
  --panel-2: #1b443c;   /* nút, ô nhập */
  --line: #2b5a50;
  --ink: #ecf2ee;
  --muted: #98b3aa;
  --chips: #3d8fe6;     /* màu chip trong game */
  --mult: #e8484e;      /* màu mult trong game */
  --gold: #eab83f;      /* tiền */
  --go: #4cc98f;        /* nên đánh */
  --paper: #f3efe4;     /* mặt lá bài */
  --paper-ink: #1d1d1f;
  --font-display: "Pixelify Sans", "Courier New", monospace;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--felt); color: var(--ink); font-family: var(--font-body); font-size: 14px; }
* { box-sizing: border-box; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.app { height: 100%; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; }
.scroll > * { flex-shrink: 0; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; padding-block: 12px 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px; }

/* Thanh blind */
.blind { padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--panel); border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.blind-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-size: 18px; letter-spacing: .02em; margin-right: auto; }
.brand b { color: var(--mult); }
.sel { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; min-height: 32px; }
.meter { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; }
.bar { height: 8px; background: var(--felt); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--go); width: 0; transition: width .3s; }
.meter-num { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 13px; }
.meter-num .need { color: var(--mult); }
.counters { display: flex; gap: 8px; flex-wrap: wrap; }
.ctr { display: flex; align-items: center; gap: 2px; background: var(--felt); border-radius: 6px; padding: 2px; }
.ctr span { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 0 4px; }
.ctr b { font-family: var(--font-num); min-width: 3ch; text-align: center; }
.ctr.h b { color: var(--chips); } .ctr.d b { color: var(--mult); } .ctr.m b { color: var(--gold); }
.ctr button { width: 28px; height: 28px; border: 0; border-radius: 4px; background: var(--panel-2); }

/* Tay bài */
.sec-h { display: flex; align-items: baseline; gap: 8px; }
.sec-h h2 { font-family: var(--font-display); font-weight: 500; font-size: 15px; margin: 0; letter-spacing: .03em; }
.sec-h small { color: var(--muted); margin-left: auto; }
.hand { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 5px; min-height: 64px; padding-top: 8px; }
.hand .empty { grid-column: 1 / -1; }
.card { width: 100%; aspect-ratio: 5 / 7; border-radius: 6px; background: var(--paper); color: var(--paper-ink); border: 2px solid transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; font-family: var(--font-display); font-size: 18px; line-height: 1; padding: 0; transition: transform .15s; }
.card .s { font-size: 20px; }
.card.red { color: #c8242d; }
.card.sel { border-color: var(--gold); transform: translateY(-4px); }
.card.play { box-shadow: 0 0 0 3px var(--go); transform: translateY(-8px); }
.card.disc { box-shadow: 0 0 0 3px var(--mult); opacity: .75; }
.card .tag { position: absolute; bottom: 2px; left: 2px; right: 2px; font-family: var(--font-body); font-size: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; border-radius: 2px; padding: 1px 0; background: #00000014; }
.card .seal { position: absolute; top: 3px; right: 3px; width: 8px; height: 8px; border-radius: 50%; }
.card.ed-foil { background: linear-gradient(135deg, #e4ecf6, #c9d8ea); } .card.ed-holo { background: linear-gradient(135deg, #fbe1e6, #e7f4ff); } .card.ed-poly { background: linear-gradient(135deg, #ffe5c2, #e2ffd9, #e3dcff); }
.empty { color: var(--muted); border: 1px dashed var(--line); border-radius: 8px; padding: 14px; text-align: center; width: 100%; }

/* Bàn phím lá */
.pad { display: grid; gap: 6px; }
.ranks { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.suits { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.k { min-height: 40px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel-2); font-family: var(--font-display); font-size: 17px; }
.k.on { background: var(--gold); color: #2a2006; border-color: var(--gold); }
.k.suit-H, .k.suit-D { color: #ff7d82; }
.k.wide { font-family: var(--font-body); font-size: 13px; }
.mods { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.mods label { display: grid; gap: 2px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }

/* Gợi ý */
.advice { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 10px; }
.advice.play { border-color: var(--go); }
.advice.discard { border-color: var(--mult); }
.verdict { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.verdict .act { font-family: var(--font-display); font-size: 24px; }
.advice.play .act { color: var(--go); } .advice.discard .act { color: var(--mult); }
.score { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.score .c { background: var(--chips); color: #fff; padding: 1px 6px; border-radius: 4px; }
.score .m { background: var(--mult); color: #fff; padding: 1px 6px; border-radius: 4px; }
.reason { color: var(--muted); margin: 0; }
.alts { display: grid; gap: 4px; font-size: 13px; }
.alts div { display: flex; gap: 8px; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 4px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { min-height: 40px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); font-weight: 600; }
.btn.primary { background: var(--gold); border-color: var(--gold); color: #2a2006; }
.btn.go { background: var(--go); border-color: var(--go); color: #062a1a; }
.btn.danger { border-color: var(--mult); color: #ff9da1; }
.btn.grow { flex: 1; }
.ask { display: flex; gap: 8px; }

/* Joker */
.jlist { display: grid; gap: 6px; }
.joker { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
.joker .idx { font-family: var(--font-num); color: var(--muted); width: 2ch; text-align: right; }
.joker .nm { min-width: 0; }
.joker .nm b { display: block; font-weight: 600; }
.joker .nm small { color: var(--muted); }
.joker .ctl { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.joker input, .shopitem input { width: 64px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; min-height: 32px; }
.ib { width: 32px; height: 32px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel-2); }
.search { width: 100%; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px; min-height: 44px; }
.results { display: grid; gap: 2px; max-height: 260px; overflow-y: auto; }
.results button { text-align: left; background: transparent; border: 0; border-bottom: 1px solid var(--line); padding: 8px 4px; }
.results button small { color: var(--muted); display: block; }

/* Shop */
.shopitem { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; background: var(--panel); border-radius: 8px; padding: 8px; }
.gain { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.gain.up { color: var(--go); } .gain.low { color: var(--muted); }
.note { color: var(--muted); font-size: 12px; }

/* Cài đặt */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.levels { display: grid; gap: 4px; }
.levels div { display: grid; grid-template-columns: 1fr auto auto auto; gap: 6px; align-items: center; }
.levels b { font-family: var(--font-num); min-width: 3ch; text-align: center; }
.deckgrid { display: grid; grid-template-columns: repeat(13, 1fr); gap: 2px; }
.deckgrid button { aspect-ratio: 3/4; max-width: 100%; border-radius: 3px; border: 0; background: var(--paper); color: var(--paper-ink); font-family: var(--font-display); font-size: 11px; padding: 0; }
.deckgrid button.red { color: #c8242d; }
.deckgrid button.gone { opacity: .18; }
.deckgrid button.inhand { outline: 2px solid var(--gold); }

/* Tab dưới */
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--panel); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabs button { background: transparent; border: 0; min-height: 52px; color: var(--muted); font-family: var(--font-display); font-size: 14px; border-top: 2px solid transparent; }
.tabs button.on { color: var(--ink); border-top-color: var(--gold); }

/* Sheet dán nhãn lá quét */
.sheet { position: fixed; inset: auto 0 0 0; background: var(--panel); border-top: 1px solid var(--line); padding: 14px max(16px, env(safe-area-inset-left, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 10px; z-index: 20; max-width: 560px; margin: 0 auto; }
.sheet img { height: 90px; image-rendering: pixelated; border-radius: 6px; background: #000; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(70px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--felt); padding: 8px 14px; border-radius: 8px; font-weight: 600; z-index: 30; }
</style>

<div class="app" id="app">
  <header class="blind">
    <div class="blind-top">
      <div class="brand">Balatro <b>Advisor</b></div>
      <select class="sel" id="ante" aria-label="Ante"></select>
      <select class="sel" id="blindSel" aria-label="Blind">
        <option value="0">Small</option><option value="1">Big</option><option value="2">Boss</option>
      </select>
      <input class="sel" id="target" type="number" inputmode="numeric" aria-label="Điểm cần" style="width:96px">
    </div>
    <div class="meter">
      <div class="bar"><i id="barFill"></i></div>
      <div class="meter-num"><span id="scoreNow">0</span> / <span id="targetNum">300</span> · thiếu <span class="need" id="needNum">300</span></div>
    </div>
    <div class="counters">
      <div class="ctr h"><span>Đánh</span><button data-ctr="hands" data-d="-1" aria-label="Giảm lượt đánh">−</button><b id="handsN">4</b><button data-ctr="hands" data-d="1" aria-label="Tăng lượt đánh">+</button></div>
      <div class="ctr d"><span>Bỏ</span><button data-ctr="discards" data-d="-1" aria-label="Giảm lượt bỏ">−</button><b id="discardsN">3</b><button data-ctr="discards" data-d="1" aria-label="Tăng lượt bỏ">+</button></div>
      <div class="ctr m"><span>$</span><button data-ctr="money" data-d="-1" aria-label="Giảm tiền">−</button><b id="moneyN">4</b><button data-ctr="money" data-d="1" aria-label="Tăng tiền">+</button></div>
    </div>
  </header>

  <main class="scroll" id="view"></main>

  <nav class="tabs" id="tabs">
    <button data-tab="round" class="on">Vòng</button>
    <button data-tab="jokers">Joker</button>
    <button data-tab="shop">Shop</button>
    <button data-tab="setup">Cài đặt</button>
  </nav>
</div>
<div id="sheetHost"></div>
<div class="toast" id="toast" hidden></div>

<script>
/*__ENGINE__*/
</script>
<script>
(function () {
  const E = window.BalatroEngine;
  const Bridge = window.AndroidBridge || null;
  const $ = (s, r = document) => r.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const ENH = [['', 'Không'], ['bonus', 'Bonus'], ['mult', 'Mult'], ['wild', 'Wild'], ['glass', 'Glass'], ['steel', 'Steel'], ['stone', 'Stone'], ['gold', 'Gold'], ['lucky', 'Lucky']];
  const EDS = [['', 'Không'], ['foil', 'Foil'], ['holo', 'Holo'], ['poly', 'Poly']];
  const JEDS = [['', '—'], ['foil', 'Foil'], ['holo', 'Holo'], ['poly', 'Poly'], ['neg', 'Neg']];
  const SEALS = [['', 'Không'], ['gold', 'Gold'], ['red', 'Red'], ['blue', 'Blue'], ['purple', 'Purple']];
  const SEAL_COLOR = { gold: '#d9a521', red: '#d8323a', blue: '#3a7fd8', purple: '#8a4fd6' };
  const TAGS = Object.keys(E.GOOD_TAGS);

  // ---------- Trạng thái ----------
  const KEY = 'balatro-advisor-v1';
  const defaults = () => ({
    tab: 'round', deckType: 'red', stakeIdx: 0, ante: 1, blind: 0, target: 300, targetManual: false, score: 0,
    hands: 4, discards: 3, money: 4, baseHands: 4, baseDiscards: 3, handSize: 8, jokerSlots: 5,
    hand: [], seen: [], removed: [], deckMods: {}, extraCards: [], jokers: [], levels: {}, playedTypes: [],
    boss: { flint: false, psychic: false, debuffSuit: '', debuffFace: false }, oops: false,
    shop: [], skipTag: 'Negative', pickRank: null, selCard: null, advice: null,
  });
  let S = defaults();
  try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(defaults(), JSON.parse(raw)); } catch (e) {}
  S.advice = null;
  function save() { try { const { advice, ...rest } = S; localStorage.setItem(KEY, JSON.stringify(rest)); } catch (e) {} }

  // Bộ bài đầy đủ: 52 lá chuẩn − lá đã hủy + lá thêm; mang cải biến đã lưu
  function fullDeck() {
    const base = E.deckCards(S.deckType).filter((c) => !S.removed.includes(c.id));
    const extra = S.extraCards.map((x) => E.makeCard(x.rank, x.suit, x));
    return [...base, ...extra].map((c) => Object.assign(c, S.deckMods[c.id] || {}));
  }
  const handCards = () => S.hand.map((h) => E.makeCard(h.rank, h.suit, h));
  function deckRemaining() {
    const used = new Set([...S.hand.map((h) => h.deckId), ...S.seen]);
    return fullDeck().filter((c) => !used.has(c.id));
  }
  function ctxBase() {
    return {
      jokers: S.jokers, levels: S.levels, money: S.money, jokerSlots: S.jokerSlots, handSize: S.handSize,
      fullDeck: fullDeck(), playedTypes: new Set(S.playedTypes), boss: S.boss, oops: S.oops || S.jokers.some((j) => j.id === 'oops'),
      stakeIdx: S.stakeIdx, ante: S.ante, hands: S.baseHands, discards: S.baseDiscards,
      plasma: !!E.DECK_BY_ID[S.deckType]?.plasma, interestCap: E.DECK_BY_ID[S.deckType]?.noInterest ? 0 : 25,
    };
  }
  function targetVal() { return S.targetManual ? S.target : E.blindTarget(S.stakeIdx, S.ante, S.blind, S.boss.wall ? 4 : 2) * (E.DECK_BY_ID[S.deckType]?.plasma ? 2 : 1); }
  // Chọn deck: đặt lại chỉ số gốc và thành phần bộ bài
  function applyDeck(id) {
    const d = E.DECK_BY_ID[id] || E.DECKS[0];
    S.deckType = d.id; S.removed = []; S.extraCards = []; S.deckMods = {}; S.seen = [];
    S.baseHands = 4 + (d.hands || 0); S.baseDiscards = 3 + (d.discards || 0);
    S.handSize = 8 + (d.hand || 0); S.jokerSlots = 5 + (d.slots || 0);
    S.hands = S.baseHands; S.discards = S.baseDiscards; S.targetManual = false; S.advice = null;
  }

  // ---------- Thao tác lá ----------
  function addCard(rank, suit) {
    if (S.hand.length >= 12) return toast('Tay đã đủ lá');
    const used = new Set([...S.hand.map((h) => h.deckId), ...S.seen]);
    const d = fullDeck().find((c) => c.rank === rank && c.suit === suit && !used.has(c.id));
    const card = d ? { rank, suit, deckId: d.id, id: 'h' + d.id, enh: d.enh, ed: d.ed, seal: d.seal } : { rank, suit, deckId: null, id: 'x' + Date.now() + Math.random(), enh: null, ed: null, seal: null };
    S.hand.push(card); S.advice = null; save(); render();
  }
  function setMod(field, val) {
    const c = S.hand.find((h) => h.id === S.selCard); if (!c) return;
    c[field] = val || null;
    if (c.deckId) { S.deckMods[c.deckId] = { ...(S.deckMods[c.deckId] || {}), [field]: val || null }; }
    S.advice = null; save(); render();
  }
  function removeSel() { S.hand = S.hand.filter((h) => h.id !== S.selCard); S.selCard = null; S.advice = null; save(); render(); }

  // ---------- Gợi ý ----------
  function runAdvice() {
    if (!S.hand.length) return toast('Nhập lá trên tay trước');
    $('#adviceBox') && ($('#adviceBox').innerHTML = '<p class="reason">Đang tính…</p>');
    setTimeout(() => {
      const ctx = ctxBase();
      const hand = handCards();
      const a = E.advise({ ...ctx, hand, deckRemaining: deckRemaining(), need: targetVal() - S.score, handsLeft: S.hands, discardsLeft: S.discards }, { samples: 90 });
      const order = E.bestJokerOrder({ ...ctx, hand }, { samples: 12 });
      a.jokerOrder = order;
      S.advice = a; render(); pushHighlight();
    }, 30);
  }
  function applyAdvice() {
    const a = S.advice; if (!a) return;
    if (a.action === 'play') {
      const ids = new Set(a.play.cards);
      S.hand.filter((h) => ids.has(h.id)).forEach((h) => h.deckId && S.seen.push(h.deckId));
      S.hand = S.hand.filter((h) => !ids.has(h.id));
      S.score += a.play.score; S.hands = Math.max(0, S.hands - 1); S.money += Math.round(a.play.money || 0);
      if (!S.playedTypes.includes(a.play.type)) S.playedTypes.push(a.play.type);
      toast(S.score >= targetVal() ? 'Qua blind! Sang shop.' : `+${E.fmt(a.play.score)} điểm — nhập lá vừa rút`);
    } else if (a.action === 'discard') {
      const ids = new Set(a.discard.discard);
      S.hand.filter((h) => ids.has(h.id)).forEach((h) => h.deckId && S.seen.push(h.deckId));
      S.hand = S.hand.filter((h) => !ids.has(h.id));
      S.discards = Math.max(0, S.discards - 1);
      toast('Đã bỏ — nhập lá vừa rút');
    }
    S.advice = null; save(); render(); Bridge && Bridge.clearHighlight && Bridge.clearHighlight();
  }
  function newRound(nextBlind) {
    if (nextBlind) { if (S.blind < 2) S.blind++; else { S.blind = 0; S.ante++; } }
    S.score = 0; S.hands = S.baseHands; S.discards = S.baseDiscards; S.hand = []; S.seen = []; S.playedTypes = []; S.advice = null; S.targetManual = false;
    S.boss = { flint: false, psychic: false, debuffSuit: '', debuffFace: false };
    save(); render(); Bridge && Bridge.clearHighlight && Bridge.clearHighlight();
  }

  // ---------- Cầu nối Android (overlay + quét màn hình) ----------
  let scanBoxes = {}; // id lá trên tay → khung trên màn hình
  function pushHighlight() {
    if (!Bridge || !Bridge.highlight || !S.advice) return;
    const a = S.advice; const marks = [];
    const ids = a.action === 'play' ? a.play.cards : a.action === 'discard' ? a.discard.discard : [];
    ids.forEach((id) => { if (scanBoxes[id]) marks.push({ box: scanBoxes[id], color: a.action === 'play' ? '#4cc98f' : '#e8484e' }); });
    const label = a.action === 'play' ? `ĐÁNH ${a.play.type} · ${E.fmt(a.play.score)}` : `BỎ ${ids.length} lá`;
    Bridge.highlight(JSON.stringify({ marks, label }));
  }
  window.__onScan = function (json) {
    let r; try { r = JSON.parse(json); } catch (e) { return toast('Không đọc được kết quả quét'); }
    if (!r.cards || !r.cards.length) return toast('Không thấy lá nào — mở game ở màn chọn lá rồi quét lại');
    S.hand = []; scanBoxes = {};
    const unknown = [];
    r.cards.forEach((c, i) => {
      if (c.rank && c.suit) { addCardSilently(c.rank, c.suit); scanBoxes[S.hand[S.hand.length - 1].id] = c.box; }
      else unknown.push({ ...c, slot: i });
    });
    S.advice = null; save(); render();
    if (unknown.length) labelQueue(unknown); else toast(`Đã nhận ${r.cards.length} lá`);
  };
  function addCardSilently(rank, suit) {
    const used = new Set([...S.hand.map((h) => h.deckId), ...S.seen]);
    const d = fullDeck().find((c) => c.rank === rank && c.suit === suit && !used.has(c.id));
    S.hand.push(d ? { rank, suit, deckId: d.id, id: 'h' + d.id, enh: d.enh, ed: d.ed, seal: d.seal } : { rank, suit, deckId: null, id: 'x' + Math.random(), enh: null, ed: null, seal: null });
  }
  // Dạy app nhận lá: hiện ảnh cắt, người chơi chọn số + chất một lần, app nhớ mẫu
  function labelQueue(list) {
    if (!list.length) {
      $('#sheetHost').innerHTML = '';
      // xếp lại đúng thứ tự trái → phải như trên màn hình game
      S.hand.sort((a, b) => ((scanBoxes[a.id] || [1e9])[0]) - ((scanBoxes[b.id] || [1e9])[0]));
      save(); render(); return;
    }
    const c = list[0]; let rk = null;
    const host = $('#sheetHost');
    host.innerHTML = `<div class="sheet" role="dialog" aria-label="Dạy nhận lá">
      <div class="sec-h"><h2>Lá này là gì?</h2><small>Còn ${list.length} lá · chỉ cần dạy 1 lần</small></div>
      <img src="${c.img}" alt="Ảnh lá bài cắt từ màn hình">
      <div class="ranks">${E.RANKS.map((r) => `<button class="k" data-lr="${r}">${E.RANK_LABEL[r]}</button>`).join('')}</div>
      <div class="suits">${E.SUITS.map((s) => `<button class="k suit-${s}" data-ls="${s}">${E.SUIT_SYM[s]}</button>`).join('')}</div>
      <div class="row"><button class="btn" id="lblSkip">Bỏ qua lá này</button></div></div>`;
    host.querySelectorAll('[data-lr]').forEach((b) => b.onclick = () => { rk = +b.dataset.lr; host.querySelectorAll('[data-lr]').forEach((x) => x.classList.toggle('on', x === b)); });
    host.querySelectorAll('[data-ls]').forEach((b) => b.onclick = () => {
      if (!rk) return toast('Chọn số trước');
      Bridge && Bridge.learn && Bridge.learn(c.tid, rk, b.dataset.ls);
      addCardSilently(rk, b.dataset.ls); scanBoxes[S.hand[S.hand.length - 1].id] = c.box;
      labelQueue(list.slice(1));
    });
    $('#lblSkip').onclick = () => labelQueue(list.slice(1));
  }

  // ---------- Hiển thị ----------
  function cardHTML(h, extra = '') {
    const red = h.suit === 'H' || h.suit === 'D';
    const stone = h.enh === 'stone';
    return `<button class="card ${red ? 'red' : ''} ${h.ed ? 'ed-' + h.ed : ''} ${extra}" data-card="${h.id}" aria-label="${stone ? 'Stone' : E.RANK_LABEL[h.rank] + ' ' + h.suit}">
      ${stone ? '<span>◼</span>' : `<span>${E.RANK_LABEL[h.rank]}</span><span class="s">${E.SUIT_SYM[h.suit]}</span>`}
      ${h.enh && !stone ? `<span class="tag">${h.enh}</span>` : ''}
      ${h.seal ? `<span class="seal" style="background:${SEAL_COLOR[h.seal]}"></span>` : ''}</button>`;
  }
  const opts = (list, v) => list.map(([k, l]) => `<option value="${k}" ${String(v || '') === k ? 'selected' : ''}>${l}</option>`).join('');

  function viewRound() {
    const a = S.advice;
    const playIds = new Set(a && a.action === 'play' ? a.play.cards : []);
    const discIds = new Set(a && a.action === 'discard' ? a.discard.discard : []);
    const sel = S.hand.find((h) => h.id === S.selCard);
    let adv = '';
    if (a) {
      const p = a.play;
      const jo = a.jokerOrder && a.jokerOrder.changed ? `<p class="reason">Xếp lại joker: ${a.jokerOrder.order.map((j) => esc(E.JOKER_BY_ID[j.id]?.name || j.id)).join(' → ')} (+${Math.round(a.jokerOrder.gain * 100)}%) <button class="btn" id="applyOrder">Áp dụng</button></p>` : '';
      if (a.action === 'play') adv = `<div class="advice play"><div class="verdict"><span class="act">ĐÁNH</span><b>${p.type}</b>
        <span class="score"><span class="c">${E.fmt(p.chips)}</span> × <span class="m">${E.fmt(p.mult)}</span> = <b>${E.fmt(p.score)}</b></span></div>
        <p class="reason">${esc(a.reason)}</p>${jo}
        ${a.alternatives?.length ? `<div class="alts">${a.alternatives.map((x) => `<div><span>${x.type} · ${x.cards.length} lá</span><span class="score">${E.fmt(x.score)}</span></div>`).join('')}</div>` : ''}
        <div class="row"><button class="btn go grow" id="doIt">Đã đánh xong</button></div></div>`;
      else if (a.action === 'discard') adv = `<div class="advice discard"><div class="verdict"><span class="act">BỎ ${a.discard.discard.length} LÁ</span>
        <span class="note">Nếu đánh ngay: ${p.type} ${E.fmt(p.score)}</span></div>
        <p class="reason">${esc(a.reason)} Kỳ vọng sau khi rút: ~${E.fmt(a.discard.avg)} điểm.</p>${jo}
        <div class="row"><button class="btn danger grow" id="doIt">Đã bỏ xong</button></div></div>`;
    }
    return `
      <section class="sec-h"><h2>Tay bài</h2><small>${S.hand.length}/${S.handSize} lá · còn ${deckRemaining().length} lá trong bộ</small></section>
      <div class="hand" id="hand">${S.hand.length ? S.hand.map((h) => cardHTML(h, `${h.id === S.selCard ? 'sel' : ''} ${playIds.has(h.id) ? 'play' : ''} ${discIds.has(h.id) ? 'disc' : ''}`)).join('') : '<div class="empty">Chạm số rồi chạm chất để thêm lá. Lá đã chạm có thể đổi Enhancement / Seal.</div>'}</div>
      <div class="ask">
        ${Bridge ? '<button class="btn" id="scan">Quét màn hình</button>' : ''}
        <button class="btn primary grow" id="ask">Gợi ý nước đi</button>
      </div>
      <div id="adviceBox">${adv}</div>
      ${sel ? `<div class="mods">
        <label>Enhancement<select class="sel" id="mEnh">${opts(ENH, sel.enh)}</select></label>
        <label>Edition<select class="sel" id="mEd">${opts(EDS, sel.ed)}</select></label>
        <label>Seal<select class="sel" id="mSeal">${opts(SEALS, sel.seal)}</select></label></div>
        <div class="row"><button class="btn danger" id="rmCard">Xóa lá</button><button class="btn" id="deselect">Xong</button></div>` : ''}
      <div class="pad">
        <div class="ranks">${E.RANKS.map((r) => `<button class="k ${S.pickRank === r ? 'on' : ''}" data-rank="${r}">${E.RANK_LABEL[r]}</button>`).join('')}<button class="k wide" id="clearHand">Xóa tay</button></div>
        <div class="suits">${E.SUITS.map((s) => `<button class="k suit-${s}" data-suit="${s}" aria-label="Chất ${s}">${E.SUIT_SYM[s]}</button>`).join('')}</div>
      </div>
      <div class="row">
        <button class="btn grow" id="nextBlind">Thắng blind → blind sau</button>
        <button class="btn" id="resetRound">Làm lại vòng</button>
      </div>
      ${S.blind === 2 ? `<section class="sec-h"><h2>Luật boss</h2></section>
      <div class="grid2">
        <label><input type="checkbox" id="bFlint" ${S.boss.flint ? 'checked' : ''}> The Flint (½ gốc)</label>
        <label><input type="checkbox" id="bPsy" ${S.boss.psychic ? 'checked' : ''}> The Psychic (5 lá)</label>
        <label><input type="checkbox" id="bFace" ${S.boss.debuffFace ? 'checked' : ''}> The Plant (lá mặt)</label>
        <label><input type="checkbox" id="bWall" ${S.boss.wall ? 'checked' : ''}> The Wall (×4)</label>
        <label>Vô hiệu chất <select class="sel" id="bSuit">${opts([['', 'Không'], ['S', '♠ Goad'], ['H', '♥ Heart'], ['C', '♣ Club'], ['D', '♦ Window']], S.boss.debuffSuit)}</select></label>
      </div>` : ''}`;
  }

  let jq = '';
  function jokerResults(q, attr) {
    const n = q.trim().toLowerCase();
    const list = E.JOKERS.filter((j) => !n || j.name.toLowerCase().includes(n) || j.vi.toLowerCase().includes(n)).slice(0, 40);
    return list.map((j) => `<button ${attr}="${j.id}"><b>${esc(j.name)}</b><small>${esc(j.vi)}</small></button>`).join('');
  }
  function viewJokers() {
    return `
      <section class="sec-h"><h2>Joker</h2><small>${S.jokers.length}/${S.jokerSlots} ô · trái → phải</small></section>
      <div class="jlist">${S.jokers.length ? S.jokers.map((j, i) => {
        const d = E.JOKER_BY_ID[j.id] || { name: j.id, vi: '' };
        const val = d.value === 'custom' ? `<input id="jc${i}" data-jf="chips" data-ji="${i}" type="number" placeholder="+chip" value="${j.chips ?? ''}"><input data-jf="mult" data-ji="${i}" type="number" placeholder="+mult" value="${j.mult ?? ''}"><input data-jf="x" data-ji="${i}" type="number" step="0.1" placeholder="×" value="${j.x ?? ''}">`
          : d.value === 'chat' ? `<select class="sel" data-jf="suit" data-ji="${i}">${opts(E.SUITS.map((s) => [s, E.SUIT_SYM[s]]), j.suit || 'H')}</select>`
          : d.value === 'la' ? `<select class="sel" data-jf="rank" data-ji="${i}">${opts(E.RANKS.map((r) => [String(r), E.RANK_LABEL[r]]), String(j.rank || 14))}</select><select class="sel" data-jf="suit" data-ji="${i}">${opts(E.SUITS.map((s) => [s, E.SUIT_SYM[s]]), j.suit || 'S')}</select>`
          : d.value === 'kichHoat' ? `<label class="note"><input type="checkbox" data-jf="v" data-ji="${i}" ${j.v ? 'checked' : ''}> đang ×4</label>`
          : d.value ? `<input data-jf="v" data-ji="${i}" type="number" step="0.1" placeholder="${d.value === 'x' ? '×' : '+'}" value="${j.v ?? ''}" aria-label="Giá trị hiện tại">` : '';
        return `<div class="joker"><span class="idx">${i + 1}</span><div class="nm"><b>${esc(d.name)}</b><small>${esc(d.vi)}</small></div>
          <div class="ctl">${val}<select class="sel" data-jf="ed" data-ji="${i}" aria-label="Edition">${opts(JEDS, j.ed)}</select>
          <button class="ib" data-jmove="${i}" data-d="-1" aria-label="Sang trái">↑</button><button class="ib" data-jmove="${i}" data-d="1" aria-label="Sang phải">↓</button><button class="ib" data-jdel="${i}" aria-label="Xóa">✕</button></div></div>`;
      }).join('') : '<div class="empty">Chưa có joker. Tìm và thêm bên dưới.</div>'}</div>
      <div class="row"><button class="btn primary grow" id="optOrder">Xếp thứ tự tối ưu</button></div>
      <input class="search" id="jq" placeholder="Tìm joker: cavendish, flush, ×mult…" value="${esc(jq)}" autocomplete="off">
      <div class="results" id="jres">${jokerResults(jq, 'data-jadd')}</div>
      <p class="note">Joker chưa có trong danh sách: chọn "Joker khác (tự nhập)" và gõ +Chip / +Mult / ×Mult của nó.</p>`;
  }

  let sq = '', shopResult = null, skipResult = null;
  function viewShop() {
    return `
      <section class="sec-h"><h2>Món trong shop</h2><small>$${S.money} đang có</small></section>
      <div class="jlist">${S.shop.length ? S.shop.map((o, i) => `<div class="shopitem"><div><b>${esc(o.kind === 'joker' ? E.JOKER_BY_ID[o.joker.id]?.name : o.kind === 'planet' ? `${E.HAND_INFO[o.hand].planet} (${o.hand})` : o.name)}</b>
        ${o.kind === 'joker' ? `<select class="sel" data-sed="${i}">${opts(JEDS, o.joker.ed)}</select>` : ''}</div>
        <label class="note">$<input type="number" data-sprice="${i}" value="${o.price}" aria-label="Giá"></label><button class="ib" data-sdel="${i}" aria-label="Xóa">✕</button></div>`).join('') : '<div class="empty">Thêm joker hoặc planet đang bày trong shop.</div>'}</div>
      <div class="row"><select class="sel grow" id="planetSel">${E.HAND_TYPES.map(([n, , , , , p]) => `<option value="${n}">${p} — ${n}</option>`).join('')}</select><button class="btn" id="addPlanet">+ Planet</button></div>
      <input class="search" id="sq" placeholder="Thêm joker trong shop…" value="${esc(sq)}" autocomplete="off">
      <div class="results" id="sres">${sq ? jokerResults(sq, 'data-sadd') : ''}</div>
      <div class="row"><button class="btn primary grow" id="rateShop">Nên mua gì?</button></div>
      <div id="shopOut">${shopResult ? shopResult : ''}</div>
      <section class="sec-h"><h2>Có nên skip blind?</h2></section>
      <div class="row"><select class="sel" id="tagSel">${TAGS.map((t) => `<option ${t === S.skipTag ? 'selected' : ''}>${t}</option>`).join('')}</select>
        <button class="btn grow" id="rateSkip">Đánh giá skip ${['Small', 'Big', 'Boss'][S.blind]} Blind</button></div>
      <div id="skipOut">${skipResult || ''}</div>`;
  }

  function viewSetup() {
    const deck = fullDeck(); const ids = new Set(deck.map((c) => c.id));
    const inHand = new Set(S.hand.map((h) => h.deckId));
    return `
      <section class="sec-h"><h2>Ván chơi</h2></section>
      <label class="note">Deck<select class="sel" id="deckSel" style="width:100%">${E.DECKS.map((d) => `<option value="${d.id}" ${d.id === S.deckType ? 'selected' : ''}>${d.name} — ${d.vi}</option>`).join('')}</select></label>
      <div class="grid2">
        <label class="note">Stake<select class="sel" id="stake">${E.STAKES.map((s, i) => `<option value="${i}" ${i === S.stakeIdx ? 'selected' : ''}>${s}</option>`).join('')}</select></label>
        <label class="note">Kích thước tay<input class="sel" id="hsize" type="number" value="${S.handSize}"></label>
        <label class="note">Lượt đánh mỗi vòng<input class="sel" id="bh" type="number" value="${S.baseHands}"></label>
        <label class="note">Lượt bỏ mỗi vòng<input class="sel" id="bd" type="number" value="${S.baseDiscards}"></label>
        <label class="note">Ô joker<input class="sel" id="slots" type="number" value="${S.jokerSlots}"></label>
        <label class="note"><input type="checkbox" id="oops" ${S.oops ? 'checked' : ''}> Có Oops! All 6s</label>
      </div>
      <section class="sec-h"><h2>Level tay bài</h2><small>tăng khi dùng planet</small></section>
      <div class="levels">${E.HAND_TYPES.map(([n]) => { const l = S.levels[n] || 1; const hi = E.HAND_INFO[n];
        return `<div><span>${n} <span class="note">${hi.chips + hi.dc * (l - 1)}×${hi.mult + hi.dm * (l - 1)}</span></span><button class="ib" data-lv="${n}" data-d="-1" aria-label="Giảm level">−</button><b>${l}</b><button class="ib" data-lv="${n}" data-d="1" aria-label="Tăng level">+</button></div>`; }).join('')}</div>
      <section class="sec-h"><h2>Bộ bài</h2><small>${deck.length} lá · chạm để đánh dấu lá đã bị hủy</small></section>
      <div style="overflow-x:auto"><div class="deckgrid">${E.deckCards(S.deckType).map((c) => `<button class="${c.suit === 'H' || c.suit === 'D' ? 'red' : ''} ${ids.has(c.id) ? '' : 'gone'} ${inHand.has(c.id) ? 'inhand' : ''}" data-deck="${c.id}" aria-label="${c.id}">${E.RANK_LABEL[c.rank]}${E.SUIT_SYM[c.suit]}</button>`).join('')}</div></div>
      <div class="row"><select class="sel" id="xr">${E.RANKS.map((r) => `<option value="${r}">${E.RANK_LABEL[r]}</option>`).join('')}</select><select class="sel" id="xs">${E.SUITS.map((s) => `<option value="${s}">${E.SUIT_SYM[s]}</option>`).join('')}</select>
        <button class="btn" id="addExtra">+ Lá thêm (Cryptid, DNA…)</button></div>
      ${S.extraCards.length ? `<p class="note">Lá thêm: ${S.extraCards.map((x, i) => `${E.RANK_LABEL[x.rank]}${E.SUIT_SYM[x.suit]} <button class="ib" data-xdel="${i}" aria-label="Xóa">✕</button>`).join(' ')}</p>` : ''}
      <section class="sec-h"><h2>Bắt đầu lại</h2></section>
      <div class="row"><button class="btn danger" id="newRun">Ván mới (xóa hết)</button></div>
      <p class="note">Gợi ý dùng giá trị kỳ vọng cho hiệu ứng may rủi (Lucky, Misprint, Bloodstone). Dữ liệu lưu trên máy này.</p>`;
  }

  function renderHeader() {
    const ante = $('#ante');
    if (!ante.options.length) for (let i = 1; i <= 16; i++) ante.add(new Option('Ante ' + i, i));
    ante.value = S.ante; $('#blindSel').value = S.blind;
    const t = targetVal();
    if (document.activeElement !== $('#target')) $('#target').value = t;
    $('#scoreNow').textContent = E.fmt(S.score); $('#targetNum').textContent = E.fmt(t);
    $('#needNum').textContent = E.fmt(Math.max(0, t - S.score));
    $('#barFill').style.width = Math.min(100, (S.score / t) * 100) + '%';
    $('#handsN').textContent = S.hands; $('#discardsN').textContent = S.discards; $('#moneyN').textContent = S.money;
    document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.tab === S.tab));
  }
  function render() {
    renderHeader();
    const v = $('#view');
    v.innerHTML = S.tab === 'round' ? viewRound() : S.tab === 'jokers' ? viewJokers() : S.tab === 'shop' ? viewShop() : viewSetup();
    bind();
  }
  function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => (t.hidden = true), 2200); }

  // ---------- Sự kiện ----------
  function bind() {
    const v = $('#view');
    const on = (sel, ev, fn) => { const el = v.querySelector(sel); if (el) el[ev] = fn; };
    v.querySelectorAll('[data-rank]').forEach((b) => b.onclick = () => { S.pickRank = +b.dataset.rank; render(); });
    v.querySelectorAll('[data-suit]').forEach((b) => b.onclick = () => { if (!S.pickRank) return toast('Chạm số trước'); addCard(S.pickRank, b.dataset.suit); });
    v.querySelectorAll('[data-card]').forEach((b) => b.onclick = () => { S.selCard = S.selCard === b.dataset.card ? null : b.dataset.card; render(); });
    on('#ask', 'onclick', runAdvice);
    on('#scan', 'onclick', () => Bridge.scan(S.handSize || 8));
    on('#doIt', 'onclick', applyAdvice);
    on('#applyOrder', 'onclick', () => { S.jokers = S.advice.jokerOrder.order; S.advice = null; save(); runAdvice(); });
    on('#mEnh', 'onchange', (e) => setMod('enh', e.target.value));
    on('#mEd', 'onchange', (e) => setMod('ed', e.target.value));
    on('#mSeal', 'onchange', (e) => setMod('seal', e.target.value));
    on('#rmCard', 'onclick', removeSel);
    on('#deselect', 'onclick', () => { S.selCard = null; render(); });
    on('#clearHand', 'onclick', () => { S.hand = []; S.advice = null; save(); render(); });
    on('#nextBlind', 'onclick', () => { newRound(true); S.tab = 'shop'; render(); });
    on('#resetRound', 'onclick', () => newRound(false));
    const boss = (id, k) => on(id, 'onchange', (e) => { S.boss[k] = e.target.type === 'checkbox' ? e.target.checked : e.target.value; S.advice = null; save(); render(); });
    boss('#bFlint', 'flint'); boss('#bPsy', 'psychic'); boss('#bFace', 'debuffFace'); boss('#bSuit', 'debuffSuit'); boss('#bWall', 'wall');
    // Joker
    on('#jq', 'oninput', (e) => { jq = e.target.value; $('#jres').innerHTML = jokerResults(jq, 'data-jadd'); bindAdd(); });
    function bindAdd() { v.querySelectorAll('[data-jadd]').forEach((b) => b.onclick = () => { if (S.jokers.length >= S.jokerSlots + S.jokers.filter((j) => j.ed === 'neg').length) return toast('Hết ô joker — tăng số ô trong Cài đặt'); S.jokers.push({ id: b.dataset.jadd }); jq = ''; save(); render(); }); }
    bindAdd();
    v.querySelectorAll('[data-jf]').forEach((el) => el.onchange = () => { const j = S.jokers[+el.dataset.ji]; const f = el.dataset.jf; j[f] = el.type === 'checkbox' ? el.checked : el.type === 'number' ? (el.value === '' ? undefined : +el.value) : f === 'rank' ? +el.value : (el.value || null); S.advice = null; save(); });
    v.querySelectorAll('[data-jmove]').forEach((b) => b.onclick = () => { const i = +b.dataset.jmove, k = i + +b.dataset.d; if (k < 0 || k >= S.jokers.length) return; [S.jokers[i], S.jokers[k]] = [S.jokers[k], S.jokers[i]]; save(); render(); });
    v.querySelectorAll('[data-jdel]').forEach((b) => b.onclick = () => { S.jokers.splice(+b.dataset.jdel, 1); save(); render(); });
    on('#optOrder', 'onclick', () => { const r = E.bestJokerOrder({ ...ctxBase(), hand: handCards() }, { samples: 25 }); if (!r.changed) return toast('Thứ tự hiện tại đã tối ưu'); S.jokers = r.order; save(); render(); toast('Đã xếp lại thứ tự joker'); });
    // Shop
    on('#sq', 'oninput', (e) => { sq = e.target.value; $('#sres').innerHTML = sq ? jokerResults(sq, 'data-sadd') : ''; bindShopAdd(); });
    function bindShopAdd() { v.querySelectorAll('[data-sadd]').forEach((b) => b.onclick = () => { const d = E.JOKER_BY_ID[b.dataset.sadd]; S.shop.push({ kind: 'joker', joker: { id: d.id }, price: [0, 5, 6, 8, 20][d.r] || 5 }); sq = ''; shopResult = null; save(); render(); }); }
    bindShopAdd();
    on('#addPlanet', 'onclick', () => { S.shop.push({ kind: 'planet', hand: $('#planetSel').value, price: 3 }); shopResult = null; save(); render(); });
    v.querySelectorAll('[data-sprice]').forEach((el) => el.onchange = () => { S.shop[+el.dataset.sprice].price = +el.value; save(); });
    v.querySelectorAll('[data-sed]').forEach((el) => el.onchange = () => { S.shop[+el.dataset.sed].joker.ed = el.value || null; save(); });
    v.querySelectorAll('[data-sdel]').forEach((b) => b.onclick = () => { S.shop.splice(+b.dataset.sdel, 1); shopResult = null; save(); render(); });
    on('#rateShop', 'onclick', () => {
      if (!S.shop.length) return toast('Thêm món trong shop trước');
      $('#shopOut').innerHTML = '<p class="reason">Đang mô phỏng…</p>';
      setTimeout(() => {
        const r = E.adviseShop({ ...ctxBase(), jokers: S.jokers }, S.shop, { samples: 40 });
        const req = E.blindTarget(S.stakeIdx, S.ante, 2);
        shopResult = `<p class="reason">Sức điểm hiện tại ~${E.fmt(r.base)}/tay · Boss ante ${S.ante} cần ${E.fmt(req)} trong ${S.baseHands} tay.</p>` + r.items.map((it, k) => `<div class="shopitem"><div><b>${k + 1}. ${esc(it.kind === 'joker' ? E.JOKER_BY_ID[it.joker.id]?.name : it.kind === 'planet' ? E.HAND_INFO[it.hand].planet : it.name)}</b>
          <div class="note">${it.note ? esc(it.note) + ' · ' : ''}${it.afford ? '' : 'không đủ tiền · '}${it.lostInterest ? `mất $${it.lostInterest} lãi/vòng` : 'không mất lãi'}</div></div>
          <span class="gain ${it.gain > 0.1 ? 'up' : 'low'}">${it.gain == null ? '?' : (it.gain >= 0 ? '+' : '') + Math.round(it.gain * 100) + '%'}</span><span class="note">$${it.price}</span></div>`).join('') +
          '<p class="note">% = mức tăng điểm trung bình mỗi tay. Món tăng dưới 10% thường không đáng phá mốc lãi.</p>';
        render();
      }, 30);
    });
    on('#tagSel', 'onchange', (e) => { S.skipTag = e.target.value; save(); });
    on('#rateSkip', 'onclick', () => {
      if (S.blind === 2) { skipResult = '<p class="reason">Boss Blind không skip được.</p>'; return render(); }
      const r = E.adviseSkip({ ...ctxBase() }, S.blind, S.skipTag);
      skipResult = `<div class="advice ${r.skip ? 'play' : 'discard'}"><div class="verdict"><span class="act">${r.skip ? 'NÊN SKIP' : 'KHÔNG SKIP'}</span></div>
        <p class="reason">Ước tính cả vòng ~${E.fmt(r.roundCap)} điểm; blind sau cần ${E.fmt(r.nextReq)}, boss cần ${E.fmt(r.bossReq)} (dư ${Math.round((r.margin - 1) * 100)}%). Tag ${esc(S.skipTag)}: giá trị ${r.tagValue}/5.</p></div>`;
      render();
    });
    // Cài đặt
    const num = (id, k, after) => on(id, 'onchange', (e) => { S[k] = Math.max(0, +e.target.value || 0); after && after(); save(); render(); });
    on('#deckSel', 'onchange', (e) => { applyDeck(e.target.value); save(); render(); toast('Đã đổi deck — đã đặt lại lượt đánh/bỏ, ô joker, bộ bài'); });
    on('#stake', 'onchange', (e) => { S.stakeIdx = +e.target.value; S.targetManual = false; save(); render(); });
    num('#hsize', 'handSize'); num('#slots', 'jokerSlots');
    num('#bh', 'baseHands', () => (S.hands = S.baseHands)); num('#bd', 'baseDiscards', () => (S.discards = S.baseDiscards));
    on('#oops', 'onchange', (e) => { S.oops = e.target.checked; save(); });
    v.querySelectorAll('[data-lv]').forEach((b) => b.onclick = () => { const n = b.dataset.lv; S.levels[n] = Math.max(1, (S.levels[n] || 1) + +b.dataset.d); S.advice = null; save(); render(); });
    v.querySelectorAll('[data-deck]').forEach((b) => b.onclick = () => { const id = b.dataset.deck; S.removed = S.removed.includes(id) ? S.removed.filter((x) => x !== id) : [...S.removed, id]; save(); render(); });
    on('#addExtra', 'onclick', () => { S.extraCards.push({ rank: +$('#xr').value, suit: $('#xs').value, id: 'x' + Date.now() }); save(); render(); });
    v.querySelectorAll('[data-xdel]').forEach((b) => b.onclick = () => { S.extraCards.splice(+b.dataset.xdel, 1); save(); render(); });
    let armed = false;
    on('#newRun', 'onclick', (e) => { if (!armed) { armed = true; e.target.textContent = 'Chạm lần nữa để xóa'; return; } const keep = S.deckType; S = defaults(); applyDeck(keep); S.money = 4 + (E.DECK_BY_ID[keep]?.money || 0); save(); render(); toast('Đã tạo ván mới'); });
  }

  // Thanh trên
  $('#ante').onchange = (e) => { S.ante = +e.target.value; S.targetManual = false; save(); render(); };
  $('#blindSel').onchange = (e) => { S.blind = +e.target.value; S.targetManual = false; save(); render(); };
  $('#target').onchange = (e) => { S.target = +e.target.value || 0; S.targetManual = true; save(); render(); };
  document.querySelectorAll('[data-ctr]').forEach((b) => b.onclick = () => { const k = b.dataset.ctr; S[k] = Math.max(0, S[k] + +b.dataset.d); S.advice = null; save(); renderHeader(); if (S.tab === 'round') render(); });
  $('#tabs').onclick = (e) => { const b = e.target.closest('button'); if (!b) return; S.tab = b.dataset.tab; save(); render(); };

  // Ví dụ khi mở lần đầu: một tay bài mẫu để thấy tool hoạt động
  if (!S.hand.length && !S.jokers.length && !S.example) {
    S.example = true;
    [[14, 'S'], [13, 'S'], [7, 'S'], [4, 'S'], [9, 'H'], [9, 'D'], [3, 'C'], [11, 'D']].forEach(([r, s]) => addCardSilently(r, s));
    S.jokers = [{ id: 'joker' }, { id: 'droll' }];
    save();
    setTimeout(() => toast('Tay bài mẫu — xóa và nhập tay của bạn'), 400);
  }
  render();
  // Trong cửa sổ nổi Android, hộp chọn gốc của WebView bị crash → thay bằng bảng chọn tự vẽ.
  if (Bridge) {
    const openPicker = (sel) => {
      const host = $('#sheetHost');
      host.innerHTML = `<div class="sheet" role="dialog" aria-label="Chọn"><div class="results">${[...sel.options].map((o, i) =>
        `<button data-pick="${i}" ${o.selected ? 'style="color:var(--gold)"' : ''}>${esc(o.text)}</button>`).join('')}</div>
        <button class="btn" id="pickClose">Đóng</button></div>`;
      host.querySelectorAll('[data-pick]').forEach((b) => b.onclick = () => {
        sel.selectedIndex = +b.dataset.pick; host.innerHTML = '';
        sel.dispatchEvent(new Event('change', { bubbles: true }));
      });
      $('#pickClose').onclick = () => (host.innerHTML = '');
    };
    const block = (e) => { const s = e.target.closest && e.target.closest('select'); if (!s) return; e.preventDefault(); e.stopPropagation(); if (e.type === 'click' || e.type === 'touchend') openPicker(s); };
    ['touchstart', 'touchend', 'mousedown', 'click'].forEach((t) => document.addEventListener(t, block, { capture: true, passive: false }));
  }
  window.__advisor = { state: () => S, render };
  window.__toast = toast;
})();
</script>
